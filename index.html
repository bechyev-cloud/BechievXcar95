function recalcContractTotal(){
  const startEl = document.getElementById('f_start'), endEl = document.getElementById('f_end');
  if(!startEl.value || !endEl.value) return;
  const rate = parseFloat(document.getElementById('f_crate').value)||0;
  const type = document.getElementById('f_rentalType')?.value || 'daily';
  if(type==='6h'){
    document.getElementById('f_total').value = rate;
  } else {
    const days = rentalDays(startEl.value, endEl.value);
    document.getElementById('f_total').value = rate*days;
  }
}
async function saveContract(id){
  const status = document.getElementById('f_cstatus').value;
  const carId = document.getElementById('f_car').value;
  let data;
  if(status==='service'){
    const repairDate = document.getElementById('f_repairdate').value;
    if(!repairDate){ showToast('Укажите дату ремонта'); return; }
    const amount = parseFloat(document.getElementById('f_repairamount').value)||0;
    const desc = document.getElementById('f_repairdesc').value.trim();
    data = {
      carId,
      clientId: null,
      start: repairDate+'T00:00', end: repairDate+'T00:00',
      rentalType: null,
      rate: 0,
      total: amount,
      status: 'service',
      paid: true,
      notes: desc,
      type: 'repair',
    };
  } else {
    const start = document.getElementById('f_start').value;
    const end = document.getElementById('f_end').value;
    const clientId = document.getElementById('f_client').value;
    if(!clientId){ showToast('Выберите или добавьте клиента'); return; }
    if(!start || !end){ showToast('Укажите дату и время начала и конца'); return; }
    if(new Date(end) <= new Date(start)){ showToast('Окончание должно быть позже начала'); return; }
    data = {
      carId,
      clientId,
      start, end,
      rentalType: document.getElementById('f_rentalType').value,
      rate: parseFloat(document.getElementById('f_crate').value)||0,
      total: parseFloat(document.getElementById('f_total').value)||0,
      status,
      paid: document.getElementById('f_paid').value==='1',
      notes: document.getElementById('f_ctnotes').value.trim(),
      type: 'rental',
    };
  }
  if(id){
    const idx = DB.contracts.findIndex(c=>c.id===id);
    const wasEnd = DB.contracts[idx].end;
    DB.contracts[idx] = {...DB.contracts[idx], ...data};
    if(wasEnd !== data.end) DB.contracts[idx].notifiedOneHour = false;
  } else {
    const newCt = { id: uid(), notifiedOneHour:false, ...data };
    DB.contracts.push(newCt);
    if(data.type!=='repair' && DB.settings.autoNotify?.rental!==false){
      const cl = DB.clients.find(c=>c.id===data.clientId);
      if(cl && cl.phone){
        sendWhatsApp(cl.phone, buildContractMessage(newCt)).then(r=>{
          if(r.ok) showToast('Договор отправлен клиенту в WhatsApp');
          else if(r.reason!=='not_configured') showToast('Не удалось отправить WhatsApp');
        });
      }
    }
  }
  // sync car status
  const car = DB.cars.find(c=>c.id===data.carId);
  if(car){
    if(data.status==='active') car.status = 'rented';
    else if(data.status==='booked') car.status = 'booked';
    else if(data.status==='service') car.status = 'service';
    else if(car.status==='rented' || car.status==='booked' || car.status==='service') car.status = 'free';
  }
  await persist('contracts'); await persist('cars');
  closeSheet(); render(); showToast(data.type==='repair' ? 'Ремонт сохранён' : 'Договор сохранён');
}

  if(isNaN(amount) || amount<=0){ showToast('Укажите сумму погашения'); return; }

  await persist('clientLedger');

}

async function settleOldDebt(contractId){
  const ct = DB.contracts.find(c=>c.id===contractId); if(!ct) return;
  if(!ct.clientId){ showToast('У этого долга нет привязанного клиента'); return; }
  const paidSoFar = oldDebtPaidAmount(contractId);
  const remaining = Math.max(0, ct.total - paidSoFar);
  let amount = parseFloat(document.getElementById('f_settle_amount').value);
  if(isNaN(amount) || amount<=0){ showToast('Укажите сумму погашения'); return; }
  if(amount>remaining) amount = remaining;
  DB.clientLedger.push({ id: uid(), clientId: ct.clientId, type:'payment', amount, date: nowDT(), note: 'Погашение старого долга', oldDebtId: contractId });
  await persist('clientLedger');
  showToast(amount>=remaining ? 'Долг погашен полностью' : `Внесено ${money(amount)}, остаток уменьшен`);
  openOldDebtContractDetail(ct);
}

function oilStatus(car){
  const mileage = car.currentMileage;
  const nextMil = car.nextOilMileage;
  const lastMil = car.lastOilChangeMileage;
  const lastDate = car.lastOilChangeDate;
  const sinceChange = (mileage!=null && lastMil!=null) ? (mileage - lastMil) : null;
  const remaining = (mileage!=null && nextMil!=null) ? (nextMil - mileage) : null;
  const dueSoon = remaining!=null && remaining<=0;
  const reminderDue = car.oilReminderDate ? (todayISO() >= car.oilReminderDate) : false;
  return { mileage, nextMil, lastMil, lastDate, sinceChange, remaining, dueSoon, reminderDue };
}

  return 'аренд';
}

async function saveMileageRecord(carId){
  const car = DB.cars.find(c=>c.id===carId); if(!car) return;
  const mileage = parseFloat(document.getElementById('f_mileage').value);
  if(isNaN(mileage) || mileage<0){ showToast('Укажите текущий пробег'); return; }
  const targetRaw = document.getElementById('f_mileage_target').value;
  const target = targetRaw!=='' ? parseFloat(targetRaw) : null;
  const date = document.getElementById('f_mileage_date').value || todayISO();
  const reminderRaw = document.getElementById('f_mileage_reminder').value;
  const reminderDays = reminderRaw!=='' ? parseInt(reminderRaw) : null;
  car.currentMileage = mileage;
  car.currentMileageDate = date;
  if(target!=null) car.nextOilMileage = target;
  if(reminderDays!=null){
    car.oilReminderDays = reminderDays;
    const rd = new Date(date); rd.setDate(rd.getDate()+reminderDays);
    car.oilReminderDate = toISO(rd);
  }
  DB.oilChanges.push({ id: uid(), carId, type:'mileage', mileage, nextMileage: target, date });
  await persist('cars'); await persist('oilChanges');
  showToast('Пробег записан');
  openRecordMileage(carId);
}

function updateNextMileagePreview(){

  const cur = parseFloat(curEl.value)||0;
  const interval = parseFloat(intEl.value)||0;
  prevEl.textContent = (cur+interval).toLocaleString('ru-RU') + ' км';
}
async function saveOilChange(carId, existingId){
  const car = DB.cars.find(c=>c.id===carId); if(!car) return;
  const mileage = parseFloat(document.getElementById('f_oil_cur').value);
  if(isNaN(mileage) || mileage<0){ showToast('Укажите пробег на момент замены'); return; }
  const interval = parseFloat(document.getElementById('f_oil_interval').value)||8000;
  const nextMileage = mileage + interval;
  const date = document.getElementById('f_oil_date').value || todayISO();
  const amount = parseFloat(document.getElementById('f_oil_amount').value)||0;
  const note = document.getElementById('f_oil_note').value.trim();
  const id = existingId || uid();
  const logEntry = { id, carId, type:'change', mileage, nextMileage, amount, note, date };
  const ctEntry = { id, carId, clientId:null, start:date, end:date, rentalType:null, rate:0, total:amount, status:'done', paid:true, notes:note, type:'oil', notifiedOneHour:false };
  if(existingId){
    const oi = DB.oilChanges.findIndex(l=>l.id===existingId);
    if(oi>-1) DB.oilChanges[oi] = logEntry; else DB.oilChanges.push(logEntry);
    const ci = DB.contracts.findIndex(c=>c.id===existingId);
    if(ci>-1) DB.contracts[ci] = ctEntry; else DB.contracts.push(ctEntry);
  } else {
    DB.oilChanges.push(logEntry);
    DB.contracts.push(ctEntry);
  }
  car.currentMileage = mileage;
  car.currentMileageDate = date;
  car.lastOilChangeMileage = mileage;
  car.lastOilChangeDate = date;
  car.nextOilMileage = nextMileage;
  car.oilIntervalKm = interval;
  await persist('oilChanges'); await persist('cars'); await persist('contracts');
  closeSheet(); render();
  showCenterConfirm(existingId ? 'Замена масла изменена' : 'Замена масла добавлена');
}

function showUpdateOverlay(){
  const el = document.getElementById('updateOverlay');

  let i = 0;
  msgEl.textContent = UPDATE_OVERLAY_MESSAGES[0];
  el.classList.add('show');
  clearInterval(window.__uoi);
  window.__uoi = setInterval(()=>{
    i = (i+1) % UPDATE_OVERLAY_MESSAGES.length;
    msgEl.style.opacity = '0';
    setTimeout(()=>{ msgEl.textContent = UPDATE_OVERLAY_MESSAGES[i]; msgEl.style.opacity = '1'; }, 150);
  }, 1000);

async function forceUpdateApp(){
  closeSheet();
  showUpdateOverlay();
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg => reg.update()));
    }
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(e){}
  setTimeout(()=>{ window.location.reload(); }, 5000);
}

function applyColorMode(mode){
  document.body.classList.toggle('theme-light', mode==='light');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', mode==='light' ? '#f6f7f9' : '#14161c');
  const metaScheme = document.querySelector('meta[name="color-scheme"]');
  if(metaScheme) metaScheme.setAttribute('content', mode==='light' ? 'light' : 'dark');
  document.documentElement.style.colorScheme = mode==='light' ? 'light' : 'dark';
}
async function setColorMode(mode){
  DB.settings.colorMode = mode;
  await persist('settings');
  applyColorMode(mode);
  openThemeSettings();
}

function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('Импорт заменит текущие данные приложения резервной копией. Продолжить?')) return;
      DB.cars = data.cars || [];
      DB.clients = data.clients || [];
      DB.contracts = data.contracts || [];
      DB.clientLedger = data.clientLedger || [];
      DB.oilChanges = data.oilChanges || [];
      DB.settings = data.settings || DB.settings;
      await persist('cars'); await persist('clients'); await persist('contracts'); await persist('clientLedger'); await persist('oilChanges'); await persist('settings');
      closeSheet(); render(); showToast('Данные восстановлены');
    }catch(e){ showToast('Файл повреждён или неверный формат'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
async function wipeAll(){
  if(!confirm('Все машины, клиенты и договоры будут удалены безвозвратно. Продолжить?')) return;
  if(!confirm('Точно удалить всё? Это действие необратимо.')) return;
  DB.cars = []; DB.clients = []; DB.contracts = []; DB.clientLedger = []; DB.oilChanges = [];
  await persist('cars'); await persist('clients'); await persist('contracts'); await persist('clientLedger'); await persist('oilChanges');
  closeSheet(); render(); showToast('Все данные удалены');
}

/* =================== CONTRACT AS IMAGE =================== */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawContractCanvas(ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  const W=860, H=1180;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1c2029'); bgGrad.addColorStop(1,'#14161c');
  ctx.fillStyle = bgGrad; roundRectPath(ctx,0,0,W,H,28); ctx.fill();
  ctx.strokeStyle = '#333a4a'; ctx.lineWidth = 2; roundRectPath(ctx,16,16,W-32,H-32,22); ctx.stroke();

  // brand mark
  const mGrad = ctx.createLinearGradient(48,48,112,112);
  mGrad.addColorStop(0,'#ffcf7a'); mGrad.addColorStop(1,'#f2a93b');
  ctx.fillStyle = mGrad; roundRectPath(ctx,48,48,62,62,16); ctx.fill();
  ctx.fillStyle = '#241a06'; ctx.font = '700 30px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('X', 79, 82);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = '#eef0f4'; ctx.font = '700 32px Arial, sans-serif';
  ctx.fillText(DB.settings.companyName || 'XCAR', 126, 78);
  ctx.fillStyle = '#9aa0ad'; ctx.font = '600 13px Arial, sans-serif';
  ctx.fillText('ДОГОВОР АРЕНДЫ АВТОМОБИЛЯ', 126, 100);

  ctx.strokeStyle='#333a4a'; ctx.beginPath(); ctx.moveTo(48,152); ctx.lineTo(W-48,152); ctx.stroke();

  let y = 200;
  function row(label, value, color){
    ctx.fillStyle = '#9aa0ad'; ctx.font = '400 15px Arial, sans-serif'; ctx.fillText(label, 48, y);
    ctx.fillStyle = color || '#eef0f4'; ctx.font = '700 23px Arial, sans-serif'; ctx.fillText(value, 48, y+32);
    y += 78;
  }
  row('Клиент', cl ? cl.name : '—');
  row('Телефон', cl && cl.phone ? cl.phone : '—');
  row('Автомобиль', car ? `${car.make} ${car.model}${car.plate ? ' · '+car.plate : ''}` : '—');
  row('Начало аренды', fmtDateTime(ct.start));
  row('Окончание аренды', fmtDateTime(ct.end));
  row('Статус', ct.status==='active'?'Активен':ct.status==='booked'?'Забронирован':ct.status==='done'?'Завершён':'Отменён');
  row('Оплата', ct.paid ? 'Оплачено' : 'Не оплачено', ct.paid ? '#3ec9a7' : '#e8604c');

  ctx.fillStyle = '#242936'; roundRectPath(ctx,48,y,W-96,120,16); ctx.fill();
  ctx.fillStyle = '#9aa0ad'; ctx.font = '600 14px Arial, sans-serif'; ctx.fillText('ИТОГО К ОПЛАТЕ', 74, y+42);
  ctx.fillStyle = '#f2a93b'; ctx.font = '700 42px Arial, sans-serif'; ctx.fillText(money(ct.total), 74, y+88);

  ctx.fillStyle = '#5d6472'; ctx.font = '400 12.5px Arial, sans-serif';
  ctx.fillText('Сформировано в приложении XCAR · ' + new Date().toLocaleDateString('ru-RU'), 48, H-46);

  return canvas;
}
function canvasToBlob(canvas){ return new Promise(res => canvas.toBlob(res, 'image/png')); }

function drawCarsStatusCanvas(){
  const order = { free:0, rented:1, booked:2, service:3 };
  const cars = DB.cars.slice().sort((a,b)=> (order[a.status]??9)-(order[b.status]??9) || a.make.localeCompare(b.make));
  const STATUS_COLOR = { free:'#22c55e', rented:'#3b82f6', booked:'#f2a93b', service:'#e8604c' };
  const STATUS_TEXT = { free:'Свободна', rented:'В аренде', booked:'Забронирована', service:'На ремонте' };
  const shortDT = s => { const d=new Date(s); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); };

  // Compact right-side text per car: status label + date/time, all on one line
  const carInfos = cars.map(car=>{
    let rightText = STATUS_TEXT[car.status] || car.status;
    if(car.status==='rented'){
      const ct = activeContractForCar(car.id);
      if(ct) rightText = `Аренда: ${shortDT(ct.start)} → ${shortDT(ct.end)}`;
    } else if(car.status==='booked'){
      const ct = DB.contracts.find(c=>c.carId===car.id && c.status==='booked');
      if(ct) rightText = `Бронь: ${shortDT(ct.start)} → ${shortDT(ct.end)}`;
    } else if(car.status==='service'){
      const ct = DB.contracts.find(c=>c.carId===car.id && c.status==='service' && c.type==='repair');
      if(ct) rightText = `Ремонт: с ${shortDT(ct.start)}`;
    }
    return { car, rightText };
  });

  const rowH = 56;
  const W = 1000, H = 260 + cars.length*rowH + 60;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff'; roundRectPath(ctx,0,0,W,H,28); ctx.fill();
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2; roundRectPath(ctx,16,16,W-32,H-32,22); ctx.stroke();

  const mGrad = ctx.createLinearGradient(48,48,112,112);
  mGrad.addColorStop(0,'#ffcf7a'); mGrad.addColorStop(1,'#f2a93b');
  ctx.fillStyle = mGrad; roundRectPath(ctx,48,48,62,62,16); ctx.fill();
  ctx.fillStyle = '#241a06'; ctx.font = '700 30px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('X', 79, 82);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = '#111827'; ctx.font = '700 32px Arial, sans-serif';
  ctx.fillText(DB.settings.companyName || 'XCAR', 126, 78);
  ctx.fillStyle = '#6b7280'; ctx.font = '600 13px Arial, sans-serif';
  ctx.fillText('СТАТУС АВТОПАРКА', 126, 100);

  ctx.strokeStyle='#e5e7eb'; ctx.beginPath(); ctx.moveTo(48,144); ctx.lineTo(W-48,144); ctx.stroke();

  let lx = 48;
  const ly = 180;
  [['free','Свободна'],['rented','В аренде'],['booked','Забронирована'],['service','На ремонте']].forEach(([k,label])=>{
    ctx.beginPath(); ctx.arc(lx+7, ly, 7, 0, Math.PI*2); ctx.fillStyle = STATUS_COLOR[k]; ctx.fill();
    ctx.fillStyle = '#374151'; ctx.font='600 14px Arial, sans-serif'; ctx.textAlign='left';
    ctx.fillText(label, lx+20, ly+5);
    lx += 20 + ctx.measureText(label).width + 30;
  });

  let y = 228;
  if(cars.length===0){
    ctx.fillStyle = '#9ca3af'; ctx.font = '500 16px Arial, sans-serif'; ctx.textAlign='center';
    ctx.fillText('Машин пока нет', W/2, y+20);
    ctx.textAlign='left';
  }
  carInfos.forEach(({car, rightText})=>{
    const boxH = rowH - 10;
    const midY = y + boxH/2;
    ctx.fillStyle = '#f8f9fb'; roundRectPath(ctx,48,y,W-96,boxH,12); ctx.fill();
    ctx.beginPath(); ctx.arc(48+27, midY, 8, 0, Math.PI*2); ctx.fillStyle = STATUS_COLOR[car.status]||'#9ca3af'; ctx.fill();
    ctx.fillStyle = '#111827'; ctx.font='700 16px Arial, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(`${car.make} ${car.model}${car.plate?' · '+car.plate:''}`, 48+52, midY);
    ctx.fillStyle = STATUS_COLOR[car.status]||'#9ca3af'; ctx.font='700 14px Arial, sans-serif'; ctx.textAlign='right';
    ctx.fillText(rightText, W-72, midY);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    y += rowH;
  });

  ctx.fillStyle = '#9ca3af'; ctx.font = '400 12.5px Arial, sans-serif';
  ctx.fillText('Сформировано в приложении XCAR · ' + new Date().toLocaleDateString('ru-RU'), 48, H-30);

  return canvas;
}

async function sendWhatsAppFile(phone, blob, filename, caption){
  const ga = DB.settings.greenApi;
  if(!ga || !ga.enabled || !ga.idInstance || !ga.apiTokenInstance) return {ok:false, reason:'not_configured'};
  const chatId = normalizePhone(phone);
  if(!chatId) return {ok:false, reason:'bad_phone'};
  try{
    const url = `https://api.greenapi.com/waInstance${ga.idInstance}/sendFileByUpload/${ga.apiTokenInstance}`;
    const fd = new FormData();
    fd.append('chatId', chatId);
    fd.append('file', blob, filename);
    if(caption) fd.append('caption', caption);
    const res = await fetch(url, { method:'POST', body: fd });
    return { ok: res.ok };
  }catch(e){ return { ok:false, reason:'network' }; }
}

/* =================== DEBT & CLIENT REPORT =================== */
function currentDueAmount(ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const now = new Date();
  const start = new Date(ct.start);
  const elapsedMs = Math.max(0, now-start);
  if(ct.rentalType==='6h'){
    const blocks = Math.floor(elapsedMs/(6*3600*1000));
    return blocks * (ct.rate || car?.rate6h || 0);
  }
  const days = Math.floor(elapsedMs/86400000);
  return days * (ct.rate || car?.rate || 0);
}
async function sendDebtToClient(carId){
  const ac = activeContractForCar(carId);
  if(!ac){ showToast('Нет активного договора по этой машине'); return; }
  const cl = DB.clients.find(c=>c.id===ac.clientId);
  if(!cl || !cl.phone){ showToast('У клиента не указан телефон'); return; }
  if(!DB.settings.greenApi?.enabled){ showToast('Сначала подключите WhatsApp в настройках'); return; }
  const car = DB.cars.find(c=>c.id===carId);
  const due = ac.paid ? 0 : currentDueAmount(ac) + overdueSurcharge(ac);
  const msg = `Здравствуйте, ${cl.name}!\n\nНакопленная сумма к оплате за аренду ${car?car.make+' '+car.model:''} на текущий момент: ${money(due)}.\nАренда началась: ${fmtDateTime(ac.start)}.`;
  showToast('Отправка...');
  const r = await sendWhatsApp(cl.phone, msg);
  showToast(r.ok ? `Долг отправлен: ${cl.name}` : 'Не удалось отправить сообщение');
}

/* ---------- payment history document (sent automatically on payment) ---------- */
function drawPaymentHistoryCanvas(clientId){
  const cl = DB.clients.find(c=>c.id===clientId);
  const brand = DB.settings.companyName || 'XCAR';
  const totalCharged = DB.contracts.filter(ct=>ct.clientId===clientId && ct.status!=='cancelled').reduce((s,ct)=>s+(ct.total||0),0);
  const payments = DB.clientLedger.filter(l=>l.clientId===clientId && l.type==='payment').slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  let running = totalCharged;
  const rows = payments.map((p,i)=>{
    running = Math.max(0, running - (p.amount||0));
    return { n:i+1, date:p.date, amount:p.amount, balance:running };
  });

  const W = 860, margin = 48;
  const colW = [70, 260, 220, W-margin*2-70-260-220];
  const colX = [margin, margin+colW[0], margin+colW[0]+colW[1], margin+colW[0]+colW[1]+colW[2]];
  const rowH = 44;
  const tableTop = 296;
  const dataRows = Math.max(1, rows.length);
  const tableH = rowH + dataRows*rowH;
  const H = tableTop + tableH + 76;

  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center'; ctx.fillStyle='#14161c'; ctx.font='700 24px Arial, sans-serif';
  ctx.fillText('ИСТОРИЯ ПЛАТЕЖЕЙ', W/2, 58);
  ctx.textAlign='right'; ctx.font='400 13px Arial, sans-serif'; ctx.fillStyle='#6b7280';
  ctx.fillText(`Дата: ${new Date().toLocaleDateString('ru-RU')}`, W-margin, 84);
  ctx.textAlign='left';
  ctx.strokeStyle='#d8dae0'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(margin,100); ctx.lineTo(W-margin,100); ctx.stroke();

  let y = 136;
  function infoRow(labelL, valueL, labelR, valueR){
    ctx.textAlign='left';
    ctx.font='700 14px Arial, sans-serif'; ctx.fillStyle='#14161c';
    ctx.fillText(labelL, margin, y);
    ctx.font='400 14px Arial, sans-serif';
    ctx.fillText(valueL, margin+158, y);
    if(labelR){
      ctx.font='700 14px Arial, sans-serif'; ctx.fillStyle='#14161c';
      ctx.fillText(labelR, W-margin-210, y);
      ctx.font='400 14px Arial, sans-serif';
      ctx.fillText(valueR, W-margin-165, y);
    }
    ctx.fillStyle='#14161c';
    y += 30;
  }
  infoRow('Продавец:', brand, 'Тел:', DB.settings.companyPhone || '—');
  infoRow('Покупатель:', cl ? cl.name : '—', 'Тел:', cl?.phone || '—');
  y += 6;
  infoRow('Начислено всего:', money(totalCharged));
  ctx.font='700 15px Arial, sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#14161c';
  ctx.fillText('Остаток долга на сегодня:', margin, y);
  ctx.textAlign='right'; ctx.fillStyle = running>0 ? '#c0392b' : '#1e824c';
  ctx.fillText(money(running), W-margin, y);
  ctx.textAlign='left'; ctx.fillStyle='#14161c';

  const tableW = colX[3]+colW[3]-colX[0];
  function cellBorders(rowY){
    ctx.strokeStyle='#14161c'; ctx.lineWidth=1.2;
    ctx.strokeRect(colX[0], rowY, tableW, rowH);
    for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(colX[i], rowY); ctx.lineTo(colX[i], rowY+rowH); ctx.stroke(); }
  }
  let tY = tableTop;
  ctx.fillStyle='#f2f3f6'; ctx.fillRect(colX[0], tY, tableW, rowH);
  ctx.fillStyle='#14161c'; ctx.font='700 14px Arial, sans-serif'; ctx.textAlign='center';
  ['№','Дата','Сумма','Остаток долга'].forEach((h,i)=> ctx.fillText(h, colX[i]+colW[i]/2, tY+rowH/2+5));
  cellBorders(tY);
  tY += rowH;

  if(!rows.length){
    ctx.font='400 14px Arial, sans-serif'; ctx.fillStyle='#8a8f99';
    ctx.fillText('Платежей ещё не было', W/2, tY+rowH/2+5);
    cellBorders(tY);
  } else {
    rows.forEach(r=>{
      ctx.font='400 14px Arial, sans-serif'; ctx.fillStyle='#14161c';
      ctx.fillText(String(r.n), colX[0]+colW[0]/2, tY+rowH/2+5);
      ctx.fillText(fmtDate(r.date), colX[1]+colW[1]/2, tY+rowH/2+5);
      ctx.fillText(money(r.amount), colX[2]+colW[2]/2, tY+rowH/2+5);
      ctx.font='700 14px Arial, sans-serif'; ctx.fillStyle = r.balance>0 ? '#c0392b' : '#1e824c';
      ctx.fillText(money(r.balance), colX[3]+colW[3]/2, tY+rowH/2+5);
      cellBorders(tY);
      tY += rowH;
    });
  }
  ctx.textAlign='left'; ctx.fillStyle='#9aa0ad'; ctx.font='400 12px Arial, sans-serif';
  ctx.fillText(`Сформировано в приложении ${brand} · ${new Date().toLocaleDateString('ru-RU')}`, margin, H-28);

  return canvas;
}

/* =================== OWNER ALARMS (end of rental / 30 min before) =================== */
function playBeep(){
  try{
    const as = DB.settings.alarmSettings || {};
    const volume = (as.volume!==undefined ? as.volume : 70) / 100; // 0..1
    const duration = as.duration!==undefined ? as.duration : 0.4; // seconds
    const peakGain = 0.22 * volume;
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(Math.max(peakGain,0.001), ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
    o.start(); o.stop(ctx.currentTime+duration+0.02);
  }catch(e){}
}
function triggerOwnerAlarm(ct, text){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const msg = `${text}: ${car?car.make+' '+car.model:''}${car?.plate?' · '+car.plate:''}`;
  showToast(msg);
  playBeep();
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification(DB.settings.companyName || 'XCAR', { body: msg, icon:'icon-192.png' }); }catch(e){}
  }
}
async function checkOwnerAlarms(){

  let changed = false;
  for(const ct of DB.contracts){
    if(ct.status!=='active') continue;
    const minutesLeft = (new Date(ct.end) - new Date())/60000;
    if(as.before30Alarm && !ct.notified30Min && minutesLeft<=30 && minutesLeft>0){
      triggerOwnerAlarm(ct, 'До окончания аренды осталось 30 минут');
      ct.notified30Min = true; changed = true;
    }
    if(as.endAlarm && !ct.notifiedEndAlarm && minutesLeft<=0){
      triggerOwnerAlarm(ct, 'Время аренды закончилось');
      ct.notifiedEndAlarm = true; changed = true;
    }
  }
  if(changed) await persist('contracts');
}

// Спокойные, "серьёзные" тона (не игровые): success — короткий двухнотный восходящий сигнал,
// warning — приглушённый нисходящий тон (удаление/предупреждение), error — низкий двойной сигнал.
function playFeedbackSound(kind){
  if(!DB.settings.feedback?.enabled || DB.settings.feedback?.sound===false) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = {
      success: [[660,0,0.09],[880,0.08,0.11]],
      warning: [[420,0,0.16]],
      error:   [[300,0,0.12],[240,0.14,0.16]],
    }[kind] || [[600,0,0.08]];
    notes.forEach(([freq,offset,dur])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      const t0 = ctx.currentTime+offset;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.start(t0); o.stop(t0+dur+0.02);
    });
  }catch(e){}
}
function vibrateFeedback(kind){
  if(!DB.settings.feedback?.enabled || DB.settings.feedback?.vibration===false) return;
  if(!navigator.vibrate) return;
  const pattern = { success:[14], warning:[18,45,18], error:[28,55,28,55,40] }[kind] || [10];
  try{ navigator.vibrate(pattern); }catch(e){}
}
function feedback(kind){
  playFeedbackSound(kind);
  vibrateFeedback(kind);
}

function openCarDayReport(carId){
  const ac = activeContractForCar(carId);
  if(!ac){ showToast('Нет активного договора по этой машине'); return; }
  const car = DB.cars.find(c=>c.id===carId);
  const cl = DB.clients.find(c=>c.id===ac.clientId);
  const is6h = ac.rentalType==='6h';
  const periodRate = is6h ? (car?.rate6h || ac.rate || 0) : (ac.rate || car?.rate || 0);
  const periodMs = is6h ? 6*3600*1000 : 86400000;
  const periodLabel = is6h ? 'Период' : 'День';
  const start = new Date(ac.start);
  const now = new Date();
  const elapsedMs = Math.max(0, now-start);
  const periodCount = Math.floor(elapsedMs/periodMs);
  const paidAmount = ac.paidAmount!=null ? ac.paidAmount : (ac.paid ? ac.total : 0);
  const paidPeriodsCount = periodRate>0 ? Math.floor(paidAmount/periodRate) : 0;

  let rows = `<div class="dr-row">
    <div style="flex:1;min-width:0;">
      <div class="dr-row-title">${periodLabel} 0</div>
      <div class="dr-row-sub">Оформление · ${fmtDateTime(ac.start)}</div>
    </div>
    <span style="color:var(--text-faint);font-weight:700;font-family:var(--font-display);">—</span>
  </div>`;
  for(let i=1;i<=periodCount;i++){
    const d = new Date(start.getTime() + i*periodMs);
    const isPaid = i <= paidPeriodsCount;
    rows += `<div class="dr-row">
      <div style="flex:1;min-width:0;">
        <div class="dr-row-title">${periodLabel} ${i} <span class="badge ${isPaid?'paid':'unpaid'}" style="margin-left:6px;">${isPaid?'Оплачено':'Не оплачено'}</span></div>

      ${rows}

      <div class="dr-stats">

function drawDayReportCanvas(ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  const is6h = ct.rentalType==='6h';
  const periodRate = is6h ? (car?.rate6h||ct.rate||0) : (ct.rate||car?.rate||0);
  const periodMs = is6h ? 6*3600*1000 : 86400000;
  const periodLabel = is6h ? 'Период' : 'День';
  const start = new Date(ct.start);
  const now = new Date();
  const periodCount = Math.floor(Math.max(0, now-start)/periodMs);
  const paidAmount = ct.paidAmount!=null ? ct.paidAmount : (ct.paid ? ct.total : 0);
  const paidPeriodsCount = periodRate>0 ? Math.floor(paidAmount/periodRate) : 0;
  const totalPeriod = ct.total;
  const remaining = Math.max(0, totalPeriod - paidAmount);

  const W = 860, H = 492 + (periodCount+1)*52;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1c2029'); bgGrad.addColorStop(1,'#14161c');
  ctx.fillStyle = bgGrad; roundRectPath(ctx,0,0,W,H,28); ctx.fill();
  ctx.strokeStyle = '#333a4a'; ctx.lineWidth = 2; roundRectPath(ctx,16,16,W-32,H-32,22); ctx.stroke();

  const mGrad = ctx.createLinearGradient(48,48,112,112);
  mGrad.addColorStop(0,'#ffcf7a'); mGrad.addColorStop(1,'#f2a93b');
  ctx.fillStyle = mGrad; roundRectPath(ctx,48,48,62,62,16); ctx.fill();
  ctx.fillStyle = '#241a06'; ctx.font = '700 30px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('X', 79, 82);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = '#eef0f4'; ctx.font = '700 32px Arial, sans-serif';
  ctx.fillText(DB.settings.companyName || 'XCAR', 126, 78);
  ctx.fillStyle = '#9aa0ad'; ctx.font = '600 13px Arial, sans-serif';
  ctx.fillText('ОТЧЁТ ПО ДНЯМ АРЕНДЫ', 126, 100);

  ctx.strokeStyle='#333a4a'; ctx.beginPath(); ctx.moveTo(48,152); ctx.lineTo(W-48,152); ctx.stroke();

  ctx.fillStyle = '#c9cdd6'; ctx.font = '600 16px Arial, sans-serif';
  ctx.fillText(`${cl?cl.name:''} · ${car?car.make+' '+car.model:''}`, 48, 182);
  ctx.fillStyle = '#9aa0ad'; ctx.font = '400 13px Arial, sans-serif';
  ctx.fillText(`с ${fmtDateTime(ct.start)}`, 48, 202);

  let y = 234;
  const rowH = 44, rowStep = rowH + 8;
  ctx.fillStyle = '#242936'; roundRectPath(ctx,48,y,W-96,rowH,14); ctx.fill();
  ctx.fillStyle = '#e9ebf0'; ctx.font = '700 14px Arial, sans-serif';
  ctx.fillText(`${periodLabel} 0`, 66, y+20);
  ctx.fillStyle = '#7a8090'; ctx.font = '400 12px Arial, sans-serif';
  ctx.fillText(`Оформление · ${fmtDateTime(ct.start)}`, 66, y+34);
  ctx.fillStyle = '#5d6472'; ctx.font = '700 14px Arial, sans-serif'; ctx.textAlign='right';
  ctx.fillText('—', W-66, y+27);
  ctx.textAlign='left';
  y += rowStep;

  for(let i=1;i<=periodCount;i++){
    const d = new Date(start.getTime() + i*periodMs);
    const isPaid = i<=paidPeriodsCount;
    const statusColor = isPaid ? '#3ec9a7' : '#e8604c';
    ctx.fillStyle = '#242936'; roundRectPath(ctx,48,y,W-96,rowH,14); ctx.fill();
    ctx.font = '700 14px Arial, sans-serif';
    const titleText = `${periodLabel} ${i}`;
    ctx.fillStyle = '#e9ebf0';
    ctx.fillText(titleText, 66, y+20);
    const titleW = ctx.measureText(titleText).width;
    ctx.font = '700 11px Arial, sans-serif';
    ctx.fillStyle = statusColor;
    ctx.fillText(isPaid?'Оплачено':'Не оплачено', 66+titleW+10, y+20);
    ctx.fillStyle = '#7a8090'; ctx.font = '400 12px Arial, sans-serif';
    ctx.fillText(fmtDateTime(toLocalDT(d)), 66, y+34);
    ctx.fillStyle = statusColor; ctx.font = '700 14px Arial, sans-serif'; ctx.textAlign='right';
    ctx.fillText(money(periodRate), W-66, y+27);
    ctx.textAlign='left';
    y += rowStep;
  }

  y += 24;
  const boxW = (W-96-24)/3;
  const summaries = [
    { color:'#3ec9a7', bg:'rgba(62,201,167,0.12)', label:'Оплачено', value: paidAmount },
    { color:'#e8604c', bg:'rgba(232,96,76,0.12)', label:'Остаток', value: remaining },
    { color:'#eab308', bg:'rgba(234,179,8,0.12)', label:'Итого', value: totalPeriod },
  ];
  const tileH = 84;
  summaries.forEach((s,idx)=>{
    const x = 48 + idx*(boxW+12);
    const cx = x+boxW/2;
    ctx.fillStyle = s.bg; roundRectPath(ctx,x,y,boxW,tileH,18); ctx.fill();
    ctx.fillStyle = s.color; ctx.font = '800 19px Arial, sans-serif'; ctx.textAlign='center';
    ctx.fillText(money(s.value), cx, y+40);
    ctx.fillStyle = '#9aa0ad'; ctx.font = '600 12px Arial, sans-serif';
    ctx.fillText(s.label, cx, y+62);
    ctx.textAlign='left';
  });
  y += tileH;

  ctx.fillStyle = '#5d6472'; ctx.font = '400 12.5px Arial, sans-serif';
  ctx.fillText('Сформировано в приложении XCAR · ' + new Date().toLocaleDateString('ru-RU'), 48, H-30);

  return canvas;
}
async function sendDayReportImage(carId){
  const ac = activeContractForCar(carId);
  if(!ac){ showToast('Нет активного договора по этой машине'); return; }
  const cl = DB.clients.find(c=>c.id===ac.clientId);
  const canvas = drawDayReportCanvas(ac);
  const blob = await canvasToBlob(canvas);
  if(!blob){ showToast('Не удалось создать изображение'); return; }
  const filename = `otchet-dni-${ac.id.slice(0,6)}.png`;
  if(cl && cl.phone && DB.settings.greenApi?.enabled){
    showToast('Отправка...');
    const r = await sendWhatsAppFile(cl.phone, blob, filename, 'Отчёт по аренде — XCAR');
    showToast(r.ok ? 'Отчёт отправлен клиенту' : 'Не удалось отправить — проверьте подключение WhatsApp');
    return;
  }
  const file = new File([blob], filename, {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Отчёт по аренде XCAR'}); return; }catch(e){}
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Отчёт сохранён как изображение');
}

/* =================== EXTEND RENTAL =================== */
function openExtendContract(id){
  const ct = DB.contracts.find(c=>c.id===id); if(!ct) return;
  const car = DB.cars.find(c=>c.id===ct.carId);
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  const defDays = ct.rentalType==='6h' ? 0 : 1;
  const defHours = ct.rentalType==='6h' ? 6 : 0;
  const dayRate = ct.rate || car?.rate || 0;
  const defSum = ct.rentalType==='6h' ? (car?.rate6h || ct.rate || 0) : dayRate*defDays;
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Продлить аренду</div>
      <button class="icon-btn" onclick="closeSheet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-body">
      <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:14px;">
        ${cl?esc(cl.name):''} · ${car?esc(car.make+' '+car.model):''}<br>Сейчас аренда до: <b style="color:var(--text);">${fmtDateTime(ct.end)}</b>
      </div>
      <div class="field-row">
        <div class="field"><label>Дней</label><input id="ex_days" type="number" min="0" value="${defDays}" oninput="recalcExtend('${id}')"></div>
        <div class="field"><label>Часов</label><input id="ex_hours" type="number" min="0" value="${defHours}" oninput="recalcExtend('${id}')"></div>
      </div>
      <div class="field"><label>Сумма за это время (${DB.settings.currency})</label><input id="ex_sum" type="number" value="${defSum}"></div>
      <div class="field"><label>Оплачено сейчас (${DB.settings.currency})</label><input id="ex_paid" type="number" value="${defSum}"></div>
      <div class="btn-row">
        <button class="btn ghost" onclick="closeSheet()">Отмена</button>
        <button class="btn primary" onclick="confirmExtend('${id}')">Продлить</button>
      </div>
    </div>
  `);
}
function recalcExtend(id){
  const ct = DB.contracts.find(c=>c.id===id); if(!ct) return;
  const car = DB.cars.find(c=>c.id===ct.carId);
  const days = parseFloat(document.getElementById('ex_days').value)||0;
  const hours = parseFloat(document.getElementById('ex_hours').value)||0;
  const dayRate = ct.rate || car?.rate || 0;
  let sum;
  if(ct.rentalType==='6h'){
    const totalHours = days*24 + hours;
    const blocks = totalHours>0 ? Math.ceil(totalHours/6) : 0;
    sum = blocks * (car?.rate6h || ct.rate || 0);
  } else {
    sum = days*dayRate + Math.round((hours/24)*dayRate);
  }
  document.getElementById('ex_sum').value = sum;
  document.getElementById('ex_paid').value = sum;
}
async function confirmExtend(id){
  const idx = DB.contracts.findIndex(c=>c.id===id); if(idx<0) return;
  const ct = DB.contracts[idx];
  const days = parseFloat(document.getElementById('ex_days').value)||0;
  const hours = parseFloat(document.getElementById('ex_hours').value)||0;
  const sum = parseFloat(document.getElementById('ex_sum').value)||0;
  const paidNow = parseFloat(document.getElementById('ex_paid').value)||0;
  if(days<=0 && hours<=0){ showToast('Укажите хотя бы часы или дни продления'); return; }
  const newEnd = new Date(ct.end);
  newEnd.setDate(newEnd.getDate()+days);
  newEnd.setHours(newEnd.getHours()+hours);
  ct.end = toLocalDT(newEnd);
  ct.total = (ct.total||0) + sum;
  const alreadyPaid = ct.paidAmount!=null ? ct.paidAmount : (ct.paid ? Math.max(0, ct.total - sum) : 0);
  ct.paidAmount = alreadyPaid + paidNow;
  ct.paid = ct.paidAmount >= ct.total;
  ct.notifiedOneHour = false;
  await persist('contracts');
  closeSheet(); render();
  showToast('Аренда продлена');
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  const car = DB.cars.find(c=>c.id===ct.carId);
  if(cl && cl.phone && DB.settings.greenApi?.enabled){
    sendWhatsApp(cl.phone, `Здравствуйте, ${cl.name}!\n\nАренда ${car?car.make+' '+car.model:''} продлена.\nНовое время возврата: ${fmtDateTime(ct.end)}.\nК оплате за продление: ${money(sum)}.`);
  }
}

function applyTemplate(text, ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  return (text||'')
    .replace(/\{client\}/g, cl?cl.name:'')
    .replace(/\{car\}/g, car?`${car.make} ${car.model}`:'')
    .replace(/\{plate\}/g, car?.plate||'')
    .replace(/\{start\}/g, fmtDateTime(ct.start))
    .replace(/\{end\}/g, fmtDateTime(ct.end))
    .replace(/\{total\}/g, money(ct.total));
}

  const r = await sendEmailBackupNow(true);

  statusEl.style.color = r.ok ? 'var(--accent-2)' : 'var(--danger)';

async function sendEmailBackupNow(force){
  const eb = DB.settings.emailBackup;
  if(!eb || !eb.email || !eb.serviceId || !eb.templateId || !eb.publicKey) return {ok:false, reason:'not_configured'};
  const payload = { exportedAt: new Date().toISOString(), cars: DB.cars, clients: DB.clients, contracts: DB.contracts };
  try{
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        service_id: eb.serviceId, template_id: eb.templateId, user_id: eb.publicKey,
        template_params: {
          to_email: eb.email,
          backup_date: new Date().toLocaleString('ru-RU'),
          backup_json: JSON.stringify(payload)
        }
      })
    });
    if(res.ok){
      DB.settings.emailBackup.lastSentAt = new Date().toISOString();
      await persist('settings');
    }
    return { ok: res.ok };
  }catch(e){ return { ok:false, reason:'network' }; }
}
async function checkEmailBackup(){
  const eb = DB.settings.emailBackup;
  if(!eb || !eb.enabled || !eb.email || !eb.serviceId || !eb.templateId || !eb.publicKey) return;
  const last = eb.lastSentAt ? new Date(eb.lastSentAt) : null;
  const now = new Date();
  const diffDays = last ? (now-last)/86400000 : Infinity;
  const threshold = { daily:1, weekly:7, monthly:30 }[eb.interval] || 7;
  if(diffDays < threshold) return;
  const r = await sendEmailBackupNow(false);
  if(r.ok) showToast('Резервная копия отправлена на почту');
}

/* =================== SHEET / HELPERS =================== */
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

function emptyState(title, desc){
  return `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    <div class="t">${title}</div><div class="d">${desc}</div>
  </div>`;
}
function esc(s){ return (s||'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return esc(s); }

/* =================== SPLASH =================== */
function enterApp(){
  document.getElementById('splash').classList.add('hide');
  try{ sessionStorage.setItem('xcar_splash_seen','1'); }catch(e){}
}
try{
  if(sessionStorage.getItem('xcar_splash_seen')==='1'){ document.getElementById('splash').classList.add('hide'); }
}catch(e){}

/* =================== INIT =================== */
(async function init(){
  await loadAll();
  applyTheme(DB.settings.themeColor);
  applyColorMode(DB.settings.colorMode);
  applyWindowsMode(DB.settings.windowsMode);
  applyCompanyName();
  applyAppIcon();
  render();
  checkOneHourReminders();
  checkEmailBackup();
  checkOwnerAlarms();
  // keep return-timers fresh and check WhatsApp reminders without disturbing an open form
  setInterval(()=>{
    const overlayOpen = document.getElementById('overlay').classList.contains('show');
    checkOneHourReminders();
    checkEmailBackup();
    checkOwnerAlarms();
    updateNotifBadge();
    if(!overlayOpen && (currentTab==='dashboard' || currentTab==='cars' || currentTab==='contracts')) render();
  }, 60000);
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }catch(e){ console.warn('SW registration skipped', e); }
  }
})();
</script>
