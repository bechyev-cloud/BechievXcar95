<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="XCAR">
<meta name="theme-color" content="#f6f7f9">
<meta name="color-scheme" content="light">
<meta name="description" content="XCAR — учёт автопроката: машины, клиенты, договоры, отчёты, WhatsApp-уведомления">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<title>XCAR — учёт аренды</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  color-scheme:dark;
  --bg:#14161c;
  --surface:#1c2029;
  --surface-2:#242936;
  --surface-3:#2c3242;
  --border:#333a4a;
  --accent:#f2a93b;
  --accent-dim:#7a5b25;
  --accent-2:#3ec9a7;
  --accent-2-dim:#215c4e;
  --danger:#e8604c;
  --text:#eef0f4;
  --text-dim:#9aa0ad;
  --text-faint:#5d6472;
  --header-grad-start:rgba(20,22,28,0.97);
  --header-grad-end:rgba(20,22,28,0);
  --nav-bg:rgba(28,32,41,0.92);
  --overlay-bg:rgba(10,11,14,0.6);
  --card-grad-start:var(--surface);
  --card-grad-end:#1a1e27;
  --shadow-soft:0 1px 0 rgba(255,255,255,0.03) inset, 0 16px 32px -20px rgba(0,0,0,0.65);
  --shadow-card:0 1px 0 rgba(255,255,255,0.02) inset, 0 6px 16px -12px rgba(0,0,0,0.6);
  --shadow-pop:0 8px 20px rgba(0,0,0,0.35);
  --font-display:'Rajdhani',sans-serif;
  --font-body:'Inter',sans-serif;
  --radius:14px;
  --radius-sm:9px;
}
body.theme-light{
  color-scheme:light;
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#f5f5f7;
  --surface-3:#ebebef;
  --border:#e4e4e9;
  --accent:#ff9500;
  --accent-dim:#ffe3b3;
  --accent-2:#12b886;
  --accent-2-dim:#c8f3e4;
  --danger:#ff3b30;
  --text:#1c1c1e;
  --text-dim:#6e6e73;
  --text-faint:#aeaeb2;
  --header-grad-start:rgba(255,255,255,0.94);
  --header-grad-end:rgba(255,255,255,0);
  --nav-bg:rgba(255,255,255,0.92);
  --overlay-bg:rgba(20,20,24,0.35);
  --card-grad-start:#ffffff;
  --card-grad-end:#fbfbfc;
  --shadow-soft:0 1px 0 rgba(255,255,255,1) inset, 0 22px 44px -26px rgba(28,28,30,0.16), 0 3px 10px -4px rgba(28,28,30,0.07);
  --shadow-card:0 1px 0 rgba(255,255,255,1) inset, 0 8px 18px -12px rgba(28,28,30,0.12), 0 1px 4px rgba(28,28,30,0.05);
  --shadow-pop:0 12px 32px -8px rgba(28,28,30,0.18);
}
body.theme-light #app{background:var(--bg);}
body.theme-light .splash{background:var(--bg);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none;}
input, textarea{user-select:text;-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;-webkit-touch-callout:default;}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:
  radial-gradient(circle at 50% -10%, #1e2330 0%, var(--bg) 55%);}

/* ---------- splash / welcome screen ---------- */
.splash{
  position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 20%, #232838 0%, var(--bg) 60%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:opacity .45s ease, visibility .45s ease;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-glow{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:600px;
  background:radial-gradient(circle, rgba(242,169,59,0.16), transparent 65%);border-radius:50%;}
.splash-inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 32px;}
.splash-mark{
  width:84px;height:84px;border-radius:22px;
  background:conic-gradient(from 220deg, var(--accent), #ffcf7a, var(--accent));
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;
  box-shadow:0 0 0 1px rgba(242,169,59,0.25), 0 16px 40px -10px rgba(242,169,59,0.5);
}
.splash-mark svg{width:42px;height:42px;}
.splash-title{font-family:var(--font-display);font-weight:700;font-size:44px;letter-spacing:2px;}
.splash-sub{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-top:10px;max-width:280px;}
.splash-btn{
  margin-top:34px;display:flex;align-items:center;gap:10px;padding:15px 26px;border-radius:100px;border:none;
  background:linear-gradient(155deg, #ffc266, var(--accent));color:#241a06;font-family:var(--font-body);font-weight:700;font-size:14.5px;
  cursor:pointer;box-shadow:0 10px 26px -8px rgba(242,169,59,0.55);transition:transform .15s;
}
.splash-btn:active{transform:scale(0.97);}
.splash-btn svg{width:18px;height:18px;}

/* ---------- tablet & desktop wide Chrome layout ---------- */
@media (min-width: 700px){
  #app{max-width:1180px;}
  header.top{padding:20px 30px 15px;}
  #headerAddBtn{display:flex !important;}
  main{padding:6px 30px 60px;display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:14px;align-content:start;min-width:0;width:100%;}
  main > .search-bar, main > .chips, main > .section-title, main > .dash-top, main > .empty,
  main > .dash-filter-row, main > .dash-filter-inline, main > .summary-row2{grid-column:1 / -1;}
  main > .card{margin-bottom:0;}
  nav.bottom .nav-inner{max-width:1180px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));}
  .dash-top{flex-direction:row;align-items:stretch;}
  .dash-top .revenue-card{flex:1.3;}
  .dash-top .quick-stats{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .dash-filter-row .period-seg{max-width:420px;}
  .summary-row2{grid-template-columns:repeat(4, 1fr);gap:16px;}
}
@media (min-width: 1000px){
  main{grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));}
}

/* ---------- Windows mode (manual toggle: wide layout + left sidebar nav) ---------- */
body.win-mode{background:var(--bg);}
body.win-mode #app{max-width:none;margin:0 0 0 264px;width:calc(100% - 264px);background:var(--bg);}
body.win-mode header.top{padding:28px 40px 16px;background:var(--bg);}
body.win-mode header.top .brand-mark,
body.win-mode header.top .brand-text{display:none;}
body.win-mode header.top .brand-sub{font-size:22px;font-weight:700;font-family:var(--font-display);color:var(--text);letter-spacing:0.2px;}
body.win-mode #headerAddBtn{display:flex !important;}
body.win-mode main{
  padding:6px 40px 40px;display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:18px;align-content:start;max-width:1560px;margin:0 auto;min-width:0;width:100%;
}
body.win-mode main > .search-bar, body.win-mode main > .chips, body.win-mode main > .section-title,
body.win-mode main > .dash-top, body.win-mode main > .empty,
body.win-mode main > .dash-filter-row, body.win-mode main > .dash-filter-inline, body.win-mode main > .summary-row2{grid-column:1 / -1;}
body.win-mode main > .card{margin-bottom:0;}
body.win-mode main{grid-template-columns:repeat(auto-fill, minmax(310px, 1fr));}
body.win-mode .card{
  padding:20px 20px 18px;border-radius:20px;gap:15px;
  box-shadow:var(--shadow-card);
  border-color:var(--border);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
body.win-mode .card::before{opacity:0.2;width:96px;height:96px;top:-40px;right:-26px;}
body.win-mode .card::after{opacity:0.16;width:56px;height:56px;}
body.win-mode .card:hover{
  transform:translateY(-4px);
  border-color:var(--accent-dim);
  box-shadow:0 24px 42px -22px rgba(0,0,0,0.55);
  background:linear-gradient(160deg, var(--surface-2) 0%, var(--card-grad-end) 100%);
}
body.win-mode .card:hover .card-avatar{
  border-color:var(--accent-dim);
  box-shadow:0 6px 16px -6px rgba(242,169,59,0.4);
}
body.win-mode .card-avatar{
  width:50px;height:50px;border-radius:15px;font-size:16px;
  background:linear-gradient(155deg, var(--accent-dim), var(--surface-2) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
  transition:box-shadow .18s ease, border-color .18s ease;
}
body.win-mode .card-title{font-size:16px;font-weight:700;letter-spacing:0.1px;}
body.win-mode .card-sub{font-size:13px;}
body.win-mode .card-amount{font-size:18px;}
body.win-mode .badge{padding:4px 10px;font-size:10.5px;letter-spacing:0.5px;}
body.win-mode .timer-pill{padding:5px 11px 5px 8px;font-size:11.5px;}
body.win-mode .mini-icon-btn{width:31px;height:31px;border-radius:9px;transition:background .15s ease,border-color .15s ease,transform .1s ease;}
body.win-mode .mini-icon-btn:hover{background:var(--accent-dim);border-color:var(--accent-dim);color:var(--accent);}
body.win-mode .mini-icon-btn:active{transform:scale(0.94);}
body.win-mode .summary-card2{transition:transform .16s ease, box-shadow .16s ease;}
body.win-mode .summary-card2:hover{transform:translateY(-3px);box-shadow:0 18px 32px -20px rgba(0,0,0,0.5);}
body.win-mode .chips{gap:8px;}
body.win-mode .chip{padding:8px 16px;border-radius:11px;transition:transform .12s ease,border-color .15s ease;}
body.win-mode .chip:hover{border-color:var(--accent-dim);}
body.win-mode .chip.active{box-shadow:0 8px 18px -10px rgba(242,169,59,0.55);}
body.win-mode .dash-top{flex-direction:row;align-items:stretch;}
body.win-mode .dash-top .revenue-card{flex:1.3;}
body.win-mode .dash-top .quick-stats{flex:1;display:flex;flex-direction:column;justify-content:center;}
body.win-mode .dash-filter-row .period-seg{max-width:420px;}
body.win-mode .summary-row2{grid-template-columns:repeat(4, 1fr);gap:16px;}
body.win-mode .summary-card2{padding:20px 18px;border-radius:18px;}
body.win-mode .summary-card2 .ic{width:44px;height:44px;border-radius:13px;font-size:20px;}
body.win-mode .summary-card2 .n{font-size:23px;}

/* ---------- Windows mode: bigger, centered modal cards/sheets ---------- */
body.win-mode .overlay{align-items:center;padding:40px;}
body.win-mode .sheet{
  max-width:820px;max-height:91vh;max-height:91dvh;border-radius:28px;border-bottom:1px solid var(--border);
  box-shadow:0 55px 100px -30px rgba(0,0,0,0.62);
  animation:sheetPopIn .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes sheetPopIn{from{transform:translateY(14px) scale(0.97);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
body.win-mode .sheet-handle{display:none;}
body.win-mode .sheet-head{padding:30px 40px 14px;}
body.win-mode .sheet-title{font-size:26px;}
body.win-mode .sheet-head-actions{gap:11px;}
body.win-mode .icon-btn{width:46px;height:46px;border-radius:13px;}
body.win-mode .icon-btn svg{width:21px;height:21px;}
body.win-mode .sheet-body{padding:14px 40px 40px;font-size:15px;}
body.win-mode .sheet-body .client-contact-row{gap:16px;padding:20px 24px;border-radius:18px;}
body.win-mode .sheet-body .cc-item{font-size:16px;}
body.win-mode .sheet-body .cc-item svg{width:22px;height:22px;}
body.win-mode .sheet-body .summary-row2{margin:16px 0 8px;gap:18px;}
body.win-mode .sheet-body .summary-card2{padding:26px 22px;border-radius:20px;}
body.win-mode .sheet-body .summary-card2 .ic{width:50px;height:50px;border-radius:15px;font-size:23px;}
body.win-mode .sheet-body .summary-card2 .n{font-size:26px;}
body.win-mode .sheet-body .summary-card2 .l{font-size:11.5px;}
body.win-mode .sheet-body .btn-row .btn{padding:18px;font-size:16px;border-radius:15px;}
body.win-mode .sheet-body .field input,
body.win-mode .sheet-body .field select,
body.win-mode .sheet-body .field textarea{padding:14px 15px;font-size:16px;border-radius:12px;}
body.win-mode .sheet-body .field label{font-size:13px;}
body.win-mode nav.bottom{
  left:0;right:auto;top:0;bottom:0;width:264px;height:100vh;height:100dvh;justify-content:flex-start;
  box-shadow:4px 0 40px -24px rgba(0,0,0,0.7);
}
body.win-mode .nav-inner{
  flex-direction:column;max-width:264px;width:264px;height:100%;
  justify-content:flex-start;align-items:stretch;gap:3px;
  padding:22px 14px;border-top:none;border-right:1px solid var(--border);
  overflow-y:auto;background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;
}
.sidebar-brand{display:none;}
.sidebar-divider{display:none;}
body.win-mode .sidebar-brand{
  display:flex;align-items:center;gap:12px;padding:2px 10px 22px;
}
body.win-mode .sidebar-mark{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;
  background:conic-gradient(from 220deg, var(--accent), #ffcf7a, var(--accent));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 16px -8px rgba(242,169,59,0.5);
}
body.win-mode .sidebar-mark svg{width:23px;height:23px;color:#241a06;}
body.win-mode .sidebar-brand .t{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text);letter-spacing:0.4px;line-height:1.2;}
body.win-mode .sidebar-brand .s{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
body.win-mode .sidebar-divider{
  display:block;height:1px;background:var(--border);margin:0 6px 16px;
}
body.win-mode .nav-btn{
  flex:none;flex-direction:row;justify-content:flex-start;gap:13px;
  padding:12px 14px;border-radius:12px;color:var(--text-dim);
  transition:background .16s ease,color .16s ease,transform .1s ease;
}
body.win-mode .nav-btn svg{width:19px;height:19px;flex-shrink:0;}
body.win-mode .nav-btn span{font-size:14px;font-weight:600;}
body.win-mode .nav-btn:hover{background:var(--surface-2);color:var(--text);}
body.win-mode .nav-btn:active{transform:scale(0.98);}
body.win-mode .nav-btn.active{background:var(--accent);color:#241a06;font-weight:700;box-shadow:0 10px 22px -10px rgba(242,169,59,0.5);}
body.win-mode .nav-btn.active:hover{background:var(--accent);color:#241a06;}
body.win-mode .nav-btn.active::after{display:none;}
body.win-mode .nav-btn.active::before{display:none;}
body.win-mode .overlay{padding-left:264px;}
.sidebar-bottom{display:none;}
body.win-mode .sidebar-bottom{
  display:flex;flex-direction:column;gap:3px;margin-top:auto;padding-top:14px;
}
body.win-mode .sidebar-bottom .sidebar-divider{display:block;margin:0 6px 12px;}

/* ---------- header ---------- */
header.top{
  padding:calc(18px + env(safe-area-inset-top)) 18px 14px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--header-grad-start) 70%, var(--header-grad-end));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:conic-gradient(from 220deg, var(--accent), #ffcf7a, var(--accent));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(242,169,59,0.25), 0 6px 16px -4px rgba(242,169,59,0.45);
}
.brand-mark svg{width:20px;height:20px;}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:0.3px;line-height:1;}
.brand-sub{font-size:10.5px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:active{background:var(--surface-3);}
.icon-btn.wa-on{background:rgba(62,201,167,0.18);border-color:rgba(62,201,167,0.35);color:var(--accent-2);}
.notif-badge{
  position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;
  background:var(--danger);color:#fff;border-radius:100px;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;line-height:1;border:2px solid var(--bg);
}

/* ---------- main scroll area ---------- */
main{flex:1;padding:4px 16px calc(110px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;
  transition:opacity .18s ease, transform .18s ease;opacity:1;transform:translateY(0);}
main.tab-anim{opacity:0;transform:translateY(10px);}
.section-title{
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:0.5px;
  text-transform:uppercase;color:var(--text-dim);margin:22px 2px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;
}
.section-title::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px;display:inline-block;}
.section-title span.count{color:var(--text-faint);font-weight:600;}

/* ---------- dashboard revenue card (signature element) ---------- */
.dash-top{display:flex;flex-direction:column;gap:12px;}
.revenue-card{
  background:linear-gradient(160deg, var(--surface-2) 0%, var(--surface) 75%);
  border:1px solid var(--border);border-radius:22px;padding:24px 20px 16px;
  display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;
  box-shadow:var(--shadow-soft);
}
.revenue-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% -8%, rgba(242,169,59,0.16), transparent 62%);
  pointer-events:none;
}
.revenue-card::after{
  content:"";position:absolute;top:0;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);opacity:0.65;
}
.revenue-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-dim);position:relative;}
.revenue-value{
  font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:0.3px;margin-top:4px;position:relative;
  background:linear-gradient(160deg,var(--text),var(--accent) 130%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.gauge-wrap{position:relative;width:220px;height:130px;margin-top:6px;}
.gauge-wrap svg{width:100%;height:100%;}
.gauge-period-row{display:flex;gap:6px;margin-top:6px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:11px;position:relative;}
.gauge-period-row button{
  border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-weight:600;font-size:12px;
  padding:7px 14px;border-radius:8px;cursor:pointer;
}
.gauge-period-row button.active{background:var(--accent);color:#241a06;}

.car-icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;}
.car-icon-opt{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:7px 4px;border-radius:12px;border:2px solid transparent;transition:border-color .15s ease,background .15s ease;}
.car-icon-opt.active{border-color:var(--accent);background:rgba(242,169,59,0.08);}
.car-icon-tile{width:44px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;}
.car-icon-tile-none{color:var(--text-faint);font-weight:700;font-size:16px;}
.car-icon-opt span{font-size:10px;color:var(--text-dim);text-align:center;line-height:1.2;}
.car-icon-opt.active span{color:var(--text);font-weight:700;}
.car-icon-preview{width:56px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:5px;flex-shrink:0;}

.app-icon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px;}
.app-icon-opt{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 4px;border-radius:14px;border:2px solid transparent;transition:border-color .15s ease,background .15s ease;}
.app-icon-opt.active{border-color:var(--accent);background:rgba(242,169,59,0.08);}
.app-icon-tile{width:62px;height:62px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.app-icon-tile svg{width:100%;height:100%;display:block;}
.app-icon-tile.plain svg{width:60%;height:60%;}
.app-icon-opt span{font-size:10.5px;color:var(--text-dim);text-align:center;line-height:1.25;}
.app-icon-opt.active span{color:var(--text);font-weight:700;}

.brand-mark.mark-full,.sidebar-mark.mark-full,.splash-mark.mark-full{background:none;box-shadow:none;}
.brand-mark.mark-full svg,.sidebar-mark.mark-full svg,.splash-mark.mark-full svg{width:100%;height:100%;border-radius:inherit;}
.car-icon-colors{display:flex;gap:8px;flex-wrap:wrap;}
.car-color-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.car-color-dot.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg);}

.quick-stats{display:block;padding:16px 14px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.stat-mini{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.stat-mini .n{font-family:var(--font-display);font-weight:700;font-size:19px;}
.stat-mini .l{font-size:11px;color:var(--text-dim);margin-top:2px;}
.stat-mini.warn .n{color:var(--accent);}
.stat-mini.good .n{color:var(--accent-2);}

.dash-quick{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2px 16px;}
.dq-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.dq-item:last-child{border-bottom:none;}
.dq-left{display:flex;align-items:center;gap:11px;color:var(--text-dim);font-size:13px;font-weight:600;min-width:0;}
.dq-n{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text);flex-shrink:0;}
.dq-item.warn .dq-n{color:var(--danger);}
.dq-item.good .dq-n{color:var(--accent-2);}

.icon-badge{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(62,201,167,0.14);color:var(--accent-2);flex-shrink:0;
}
.icon-badge svg{width:16px;height:16px;}
.icon-badge.warn{background:rgba(124,131,253,0.14);color:#8e97ff;}
.icon-badge.danger{background:rgba(232,96,76,0.14);color:var(--danger);}

/* ---------- cards list ---------- */
.card{
  background:linear-gradient(160deg, var(--card-grad-start) 0%, var(--card-grad-end) 100%);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;
  transition:border-color .15s, transform .1s, box-shadow .15s;
  box-shadow:var(--shadow-card);
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;width:76px;height:76px;border-radius:50%;top:-34px;right:-22px;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0.04) 42%, transparent 68%),
    radial-gradient(circle, var(--accent) 0%, transparent 72%);
  opacity:0.13;pointer-events:none;z-index:0;
}
.card::after{
  content:"";position:absolute;width:44px;height:44px;border-radius:50%;bottom:-18px;left:-12px;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0.04) 42%, transparent 68%),
    radial-gradient(circle, var(--accent-2) 0%, transparent 72%);
  opacity:0.11;pointer-events:none;z-index:0;
}
.card:active{border-color:var(--accent-dim);background:var(--surface-2);transform:scale(0.99);}
.card.rented-glow{border-color:rgba(242,169,59,0.35);box-shadow:0 0 0 1px rgba(242,169,59,0.08) inset, 0 6px 18px -10px rgba(242,169,59,0.25);}
.card.overdue-glow{border-color:rgba(232,96,76,0.5);box-shadow:0 0 0 1px rgba(232,96,76,0.1) inset, 0 6px 18px -10px rgba(232,96,76,0.35);}
.card-avatar{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg, var(--surface-3), var(--surface-2));color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:15px;
  border:1px solid var(--border);
  position:relative;z-index:1;
}
.card-body{flex:1;min-width:0;position:relative;z-index:1;}
.card-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;}
.card-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.card-right{text-align:right;flex-shrink:0;position:relative;z-index:1;}
.card-amount{font-family:var(--font-display);font-weight:700;font-size:15px;}
.chev{color:var(--text-faint);width:16px;height:16px;flex-shrink:0;}

.badge{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:0.4px;
  display:inline-block;line-height:1.4;
}
.badge.free{background:rgba(62,201,167,0.14);color:var(--accent-2);}
.badge.rented{background:rgba(242,169,59,0.16);color:var(--accent);}
.badge.booked{background:rgba(124,131,253,0.16);color:#8e97ff;}
.badge.service{background:rgba(232,96,76,0.15);color:var(--danger);}
.badge.active{background:rgba(242,169,59,0.16);color:var(--accent);}
.badge.done{background:rgba(154,160,173,0.15);color:var(--text-dim);}
.badge.cancelled{background:rgba(232,96,76,0.15);color:var(--danger);}
.badge.paid{background:rgba(62,201,167,0.14);color:var(--accent-2);}
.badge.unpaid{background:rgba(232,96,76,0.15);color:var(--danger);}

.timer-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px 4px 7px;border-radius:100px;
  background:rgba(242,169,59,0.12);color:var(--accent);letter-spacing:0.2px;
}
.timer-pill.overdue{background:rgba(232,96,76,0.16);color:var(--danger);}
.timer-pill svg{width:11px;height:11px;flex-shrink:0;}
.card-actions{display:flex;gap:8px;margin-top:8px;}
.mini-btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:11.5px;font-weight:700;
  padding:7px 12px;border-radius:100px;cursor:pointer;
}
.mini-btn.finish{background:var(--accent);color:#241a06;border-color:var(--accent);}
.mini-btn.finish:active{background:#d99a30;}

/* ---------- elegant rental contract card (compact by default = mobile) ---------- */
.contract-card{flex-direction:column;align-items:stretch;padding:10px 12px 9px;}
.cc-accent{position:absolute;top:0;left:0;right:0;height:3px;z-index:2;background:linear-gradient(90deg,var(--text-faint),var(--border));}
.cc-accent.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.cc-accent.overdue{background:linear-gradient(90deg,var(--danger),#ff8a75);}
.cc-accent.cancelled{background:linear-gradient(90deg,var(--danger),var(--text-faint));}
.cc-accent.booked{background:linear-gradient(90deg,#7c83fd,#8e97ff);}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative;z-index:1;margin-top:1px;}
.cc-name{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--text);letter-spacing:0.1px;line-height:1.25;}
.cc-amount{font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--text);white-space:nowrap;flex-shrink:0;}
.cc-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;position:relative;z-index:1;align-items:center;}
.cc-meta{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-dim);margin-top:6px;position:relative;z-index:1;line-height:1.3;}
.cc-meta svg{width:11px;height:11px;color:var(--accent);flex-shrink:0;}
.cc-meta b{color:var(--text);font-weight:700;}
.cc-finish-btn{
  margin-top:8px;width:100%;padding:7px;border:none;border-radius:100px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(155deg, #5fe0bd, var(--accent-2));color:#0c2b23;font-weight:700;font-size:11px;
  font-family:var(--font-body);box-shadow:0 8px 14px -9px rgba(62,201,167,0.55);transition:transform .1s ease;
  position:relative;z-index:1;
}
.cc-finish-btn svg{width:12px;height:12px;flex-shrink:0;}
.cc-finish-btn:active{transform:scale(0.98);}
/* ---------- Windows mode: restore the roomy layout with the car/date block ---------- */
body.win-mode .contract-card{padding:16px 16px 15px;}
body.win-mode .cc-top{margin-top:2px;}
body.win-mode .cc-name{font-size:15px;line-height:1.3;}
body.win-mode .cc-amount{font-size:16.5px;}
body.win-mode .cc-badges{margin-top:8px;}
body.win-mode .cc-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border) 18%,var(--border) 82%,transparent);margin:12px 0;position:relative;z-index:1;}
body.win-mode .cc-car{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text);position:relative;z-index:1;}
body.win-mode .cc-car-ic{width:24px;height:24px;border-radius:8px;background:rgba(242,169,59,0.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
body.win-mode .cc-car-ic svg{width:13px;height:13px;color:var(--accent);flex-shrink:0;}
body.win-mode .cc-dates{font-size:11px;color:var(--text-dim);margin-top:5px;margin-left:32px;position:relative;z-index:1;}
body.win-mode .cc-timer{margin-top:10px;position:relative;z-index:1;}
body.win-mode .cc-finish-btn{margin-top:13px;padding:11px;font-size:12.5px;box-shadow:0 10px 20px -10px rgba(62,201,167,0.55);}
body.win-mode .cc-finish-btn svg{width:14px;height:14px;}

/* ---------- elegant car card (Windows mode) ---------- */
.win-car-card{flex-direction:column;align-items:stretch;}
.wcc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1;}
.wcc-name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--text);letter-spacing:0.1px;line-height:1.25;}
.wcc-amount{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--text);white-space:nowrap;flex-shrink:0;text-align:right;line-height:1.2;}
.wcc-amount-unit{display:block;font-family:var(--font-body);font-weight:600;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}
.wcc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;position:relative;z-index:1;}
.wcc-divider{height:1px;background:var(--border);margin:12px 0;opacity:0.7;position:relative;z-index:1;}
.wcc-plate{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text);letter-spacing:0.3px;position:relative;z-index:1;}
.wcc-plate svg{width:15px;height:15px;color:var(--accent);flex-shrink:0;}
.wcc-timer{margin-top:10px;position:relative;z-index:1;}
.wcc-actions{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1;}
.wcc-action-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border:none;border-radius:11px;
  background:var(--surface-3);color:var(--text);font-family:var(--font-body);font-weight:700;font-size:11.5px;cursor:pointer;
  transition:background .15s ease,transform .1s ease;
}
.wcc-action-btn:active{transform:scale(0.97);}
.wcc-action-btn svg{width:14px;height:14px;flex-shrink:0;}
.wcc-action-btn.tpl{background:rgba(242,169,59,0.14);color:var(--accent);}
.wcc-action-btn.debt{background:rgba(232,96,76,0.14);color:var(--danger);}
body.win-mode .win-car-card:hover .wcc-action-btn.tpl{background:rgba(242,169,59,0.22);}
body.win-mode .win-car-card:hover .wcc-action-btn.debt{background:rgba(232,96,76,0.22);}

.mini-icon-btn{
  margin-top:8px;width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.mini-icon-btn svg{width:14px;height:14px;}
.mini-icon-btn:active{background:var(--accent-dim);}

.empty{
  text-align:center;padding:44px 20px;color:var(--text-dim);
}
.empty svg{width:38px;height:38px;color:var(--text-faint);margin-bottom:10px;}
.empty .t{font-weight:600;color:var(--text);margin-bottom:4px;font-size:14.5px;}
.empty .d{font-size:12.5px;line-height:1.5;}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:4px;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:7px 13px;border-radius:100px;background:var(--surface);border:1px solid var(--border);
  font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;
}
.chip.active{background:var(--accent);color:#241a06;border-color:var(--accent);}
.chip-count{
  display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;
  background:rgba(255,255,255,0.12);border-radius:100px;font-size:10px;font-weight:800;margin-left:2px;
}
.chip.active .chip-count{background:rgba(36,26,6,0.25);}

.dash-filter-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dash-filter-inline .period-seg{flex:1;margin:0;gap:3px;}
.dash-filter-inline .period-seg button{padding:8px 12px;}
.dash-filter-inline .chips{flex:0 0 auto;margin-bottom:0;min-width:0;}
.dash-filter-inline .fin-tab-seg{margin:0;flex:0 0 auto;}
.dash-filter-inline .cat-seg{margin:0;flex:0 0 auto;}
.period-seg{
  display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;
  padding:3px;gap:2px;margin:10px 0 2px;
}
.period-seg button{
  flex:1;border:none;background:none;padding:8px 4px;border-radius:100px;font-size:12px;font-weight:700;
  color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s;font-family:var(--font-body);
}
.period-seg button.active{background:var(--accent);color:#241a06;box-shadow:0 2px 8px rgba(242,169,59,0.35);}
.fin-tab-seg{
  display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;
  padding:3px;gap:2px;margin:10px 0 2px;flex-shrink:0;
}
.fin-tab-seg button{
  border:none;background:none;padding:8px 15px;border-radius:100px;font-size:12px;font-weight:700;
  white-space:nowrap;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s;font-family:var(--font-body);
}
.fin-tab-seg button.active{background:var(--accent);color:#241a06;box-shadow:0 2px 8px rgba(242,169,59,0.35);cursor:default;}
.fin-tab-seg button:not(.active):hover{color:var(--text);}
.cat-seg{
  display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;
  padding:3px;gap:2px;margin:10px 0 2px;flex-shrink:0;
}
.cat-seg button{
  border:none;background:none;padding:8px 15px;border-radius:100px;font-size:12px;font-weight:700;
  white-space:nowrap;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s;font-family:var(--font-body);
}
.cat-seg button.active{background:var(--accent);color:#241a06;box-shadow:0 2px 8px rgba(242,169,59,0.35);cursor:default;}
.cat-seg button:not(.active):hover{color:var(--text);}
.period-custom{
  display:flex;align-items:center;gap:8px;margin:10px 0 4px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:10px 12px;
}
.period-custom input{
  flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 9px;
  color:var(--text);font-size:16px;font-family:var(--font-body);outline:none;min-width:0;
}
.period-custom span{color:var(--text-faint);font-size:12px;flex-shrink:0;}
.summary-row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 6px;}
.summary-card{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:11px 4px 9px;
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
.summary-card .ic{font-size:16px;line-height:1;margin-bottom:4px;}
.summary-card .n{font-family:var(--font-display);font-weight:800;font-size:12.5px;color:var(--text);line-height:1.15;word-break:break-word;}
.summary-card .l{font-size:9px;color:var(--text-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.3px;line-height:1.2;}
.summary-card.c-income .n{color:var(--accent-2);}
.summary-card.c-warn .n{color:var(--danger);}
.summary-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px;}
.client-contact-row{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;}
.cc-item{display:flex;align-items:center;gap:11px;color:var(--text);font-size:14.5px;font-weight:600;}
.cc-item svg{width:17px;height:17px;color:var(--text-dim);flex-shrink:0;}
.summary-card2{
  background:linear-gradient(160deg, var(--card-grad-start) 0%, var(--card-grad-end) 100%);
  border:1px solid var(--border);border-radius:16px;padding:16px 16px 14px;
  display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-card);
  transition:transform .15s ease;
  position:relative;overflow:hidden;
}
.summary-card2::before{
  content:"";position:absolute;width:64px;height:64px;border-radius:50%;top:-26px;right:-18px;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0.04) 42%, transparent 68%),
    radial-gradient(circle, var(--accent) 0%, transparent 72%);
  opacity:0.13;pointer-events:none;z-index:0;
}
.summary-card2:active{transform:scale(0.98);}
.summary-card2 .ic{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--surface-2);flex-shrink:0;
  position:relative;z-index:1;
}
.summary-card2.c-income .ic{background:rgba(62,201,167,0.16);}
.summary-card2.c-warn .ic{background:rgba(232,96,76,0.14);}
.summary-card2 .n{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--text);word-break:break-word;line-height:1.15;position:relative;z-index:1;}
.summary-card2 .l{font-size:10.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;position:relative;z-index:1;}
.summary-card2.c-income .n{color:var(--accent-2);}
.summary-card2.c-warn .n{color:var(--danger);}
.summary-card2.icon-teal .ic{background:rgba(62,201,167,0.16);}
.summary-card2.icon-orange .ic{background:rgba(255,159,67,0.18);}
.summary-card2.icon-red .ic{background:rgba(232,96,76,0.16);}
.summary-card2.icon-purple .ic{background:rgba(155,109,255,0.18);}
.summary-card2.icon-blue .ic{background:rgba(74,144,226,0.16);}
.summary-card2.icon-gray .ic{background:var(--surface-2);}

/* search */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:12px;}
.search-bar svg{width:16px;height:16px;color:var(--text-faint);flex-shrink:0;}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-size:16px;width:100%;font-family:var(--font-body);}
.search-bar input::placeholder{color:var(--text-faint);}

/* ---------- report ---------- */
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding:10px 4px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-fill{width:100%;max-width:26px;border-radius:5px 5px 3px 3px;background:linear-gradient(180deg, var(--accent), var(--accent-dim));min-height:3px;}
.bar-label{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.3px;}
.report-row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--border);}
.report-row:last-child{border-bottom:none;}
.report-row .rl{font-size:13.5px;color:var(--text-dim);}
.report-row .rv{font-family:var(--font-display);font-weight:700;font-size:14.5px;}

/* ---------- day report (flat style) ---------- */
.dr-row{display:flex;align-items:center;gap:11px;background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-bottom:7px;}
.dr-row-title{font-size:13px;color:var(--text);font-weight:600;}
.dr-row-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.dr-stats{display:flex;gap:10px;margin-top:16px;}
.dr-stat{flex:1;border-radius:18px;padding:16px 6px;text-align:center;}
.dr-stat.paid{background:rgba(62,201,167,0.10);}
.dr-stat.unpaid{background:rgba(232,96,76,0.10);}
.dr-stat.total{background:rgba(234,179,8,0.10);}
.dr-stat .val{font-family:var(--font-display);font-weight:800;font-size:15px;}
.dr-stat .lbl{font-size:10.5px;color:var(--text-dim);margin-top:3px;}

/* ---------- bottom nav ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
}
.nav-inner{
  max-width:520px;width:100%;display:flex;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);

.nav-btn{

}
.nav-btn svg{width:21px;height:21px;}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:0.2px;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 1px rgba(242,169,59,0.7);}

.nav-btn.nav-fab .fab-circle{
  position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  width:52px;height:52px;border-radius:50%;background:var(--accent);border:4px solid var(--nav-bg);
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -6px rgba(242,169,59,0.55);
}
.nav-btn.nav-fab .fab-circle svg{width:22px;height:22px;color:#241a06;}
.nav-btn.nav-fab .fab-label{margin-top:30px;font-size:10px;font-weight:600;letter-spacing:0.2px;}
.nav-btn.nav-fab.active .fab-label{color:var(--accent);}
.nav-btn.nav-fab.active::after{display:none;}
body.win-mode .nav-btn.nav-fab .fab-circle{

}
body.win-mode .nav-btn.nav-fab .fab-circle svg{width:19px;height:19px;color:inherit;}
body.win-mode .nav-btn.nav-fab .fab-label{margin-top:0;font-size:14px;font-weight:600;color:inherit;}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:var(--overlay-bg);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex;}
.sheet{

}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:10px;margin:10px auto 4px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;}
.sheet-head-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sheet-title{font-family:var(--font-display);font-weight:700;font-size:18px;}
.sheet-body{padding:6px 18px calc(26px + env(safe-area-inset-bottom));}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;
  color:var(--text);font-size:16px;font-family:var(--font-body);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-dim);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field textarea{resize:vertical;min-height:60px;}
.field input[type="range"]{
  width:100%;padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;height:20px;
}
.field input[type="range"]::-webkit-slider-runnable-track{height:5px;border-radius:100px;background:var(--surface-3);}
.field input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;background:var(--accent);
  border:2px solid #241a06;margin-top:-7px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.4);
}
.field input[type="range"]::-moz-range-track{height:5px;border-radius:100px;background:var(--surface-3);}
.field input[type="range"]::-moz-range-thumb{
  width:19px;height:19px;border-radius:50%;background:var(--accent);border:2px solid #241a06;cursor:pointer;
}

.btn{
  width:100%;padding:14px;border-radius:12px;border:none;font-family:var(--font-body);font-weight:700;font-size:14.5px;
  cursor:pointer;text-align:center;transition:transform .1s;
}
.btn:active{transform:scale(0.98);}
.btn.primary{background:linear-gradient(155deg, #ffc266, var(--accent));color:#241a06;box-shadow:0 8px 18px -8px rgba(242,169,59,0.55);}
.btn.primary:active{background:#d99a30;}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn.danger-ghost{background:rgba(232,96,76,0.1);color:var(--danger);border:1px solid rgba(232,96,76,0.3);}
.btn.good{background:linear-gradient(155deg, #5fe0bd, var(--accent-2));color:#0c2b23;box-shadow:0 8px 18px -8px rgba(62,201,167,0.5);}
.btn-row{display:flex;gap:10px;margin-top:6px;}
.btn-row .btn{flex:1;}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
.quick-actions.cols-3{grid-template-columns:repeat(3,1fr);}
.quick-actions.cols-2{grid-template-columns:repeat(2,1fr);gap:10px;}
.quick-action{
  display:flex;flex-direction:row;align-items:center;gap:11px;
  background:var(--surface-2);border-radius:16px;padding:12px 14px;
  cursor:pointer;transition:background .15s ease,transform .1s ease;
}
.quick-action:active{transform:scale(0.97);}
.quick-action .ic{
  width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-3);color:var(--text-dim);flex-shrink:0;
}
.quick-action .ic svg{width:18px;height:18px;}
.quick-action .lb{font-size:12.5px;font-weight:700;color:var(--text);text-align:left;line-height:1.25;letter-spacing:0.1px;}
.quick-action.primary{background:rgba(242,169,59,0.10);}
.quick-action.primary .ic{background:rgba(242,169,59,0.20);color:var(--accent);}
.quick-action.primary .lb{color:var(--accent);}
.quick-action.good{background:rgba(62,201,167,0.10);}
.quick-action.good .ic{background:rgba(62,201,167,0.20);color:var(--accent-2);}
.quick-action.good .lb{color:var(--accent-2);}
.quick-action.warn{background:rgba(232,96,76,0.10);}
.quick-action.warn .ic{background:rgba(232,96,76,0.20);color:var(--danger);}
.quick-action.warn .lb{color:var(--danger);}

.detail-block{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
.star-picker{display:flex;gap:3px;}
.star-picker .star{font-size:20px;color:var(--border);cursor:pointer;line-height:1;user-select:none;}
.star-picker .star.filled{color:var(--accent);}
.stars-display{color:var(--accent);letter-spacing:1px;font-size:12px;}
.detail-row .k{color:var(--text-dim);}
.detail-row .v{font-weight:600;text-align:right;}

.toast{

  z-index:80;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;box-shadow:var(--shadow-pop);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.center-confirm{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.82);z-index:90;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:20px;
  padding:26px 32px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;max-width:78vw;
}
.center-confirm.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.center-confirm .cc-check{
  width:52px;height:52px;border-radius:50%;background:var(--accent-2);color:#0c2b23;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.center-confirm .cc-check svg{width:26px;height:26px;}
.center-confirm .cc-text{font-size:14px;font-weight:700;color:var(--text);text-align:center;}

.update-overlay{
  position:fixed;inset:0;z-index:300;background:var(--overlay-bg);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.update-overlay.show{opacity:1;pointer-events:auto;}
.update-overlay-card{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:22px;
  padding:34px 30px;box-shadow:var(--shadow-pop);max-width:82vw;text-align:center;
  transform:scale(0.9);transition:transform .25s ease;
}
.update-overlay.show .update-overlay-card{transform:scale(1);}
.update-spinner{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  border:4px solid var(--surface-3);border-top-color:var(--accent);
  animation:updateSpin 0.9s linear infinite;
}
@keyframes updateSpin{to{transform:rotate(360deg);}}
.update-overlay-title{font-family:var(--font-display);font-weight:700;font-size:16.5px;color:var(--text);}
.update-overlay-msg{font-size:13px;color:var(--text-dim);min-height:18px;transition:opacity .2s ease;max-width:230px;}

.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--border);}
.settings-item:last-child{border-bottom:none;}
.settings-item .st{font-size:14px;font-weight:600;}
.count-badge{
  background:var(--surface-3);color:var(--text-dim);font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:100px;min-width:20px;text-align:center;line-height:1.4;
}
.count-badge.warn{background:rgba(232,96,76,0.15);color:var(--danger);}
.settings-item .sd{font-size:12px;color:var(--text-dim);margin-top:2px;}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--surface-3);border-radius:100px;transition:.2s;border:1px solid var(--border);}
.switch .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:2.5px;background:#cfd3db;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--accent-dim);border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(18px);background:var(--accent);}

.wa-master-toggle{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:6px;margin-bottom:16px;}
.wa-master-toggle button{

  padding:13px 10px;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .18s ease,color .18s ease,transform .1s ease;
}
.wa-master-toggle button:active{transform:scale(0.97);}
.wa-master-toggle button.on.active{background:rgba(62,201,167,0.18);color:var(--accent-2);box-shadow:0 6px 16px -8px rgba(62,201,167,0.5);}
.wa-master-toggle button.off.active{background:rgba(232,96,76,0.16);color:var(--danger);box-shadow:0 6px 16px -8px rgba(232,96,76,0.45);}
</style>

function reportsDateRange(){

// 'YYYY-MM-DDTHH:MM' for datetime-local inputs, in local time (not UTC)
function toLocalDT(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function nowDT(){ return toLocalDT(new Date()); }
function plusDaysDT(dtStr, days){ const d = new Date(dtStr); d.setDate(d.getDate()+days); return toLocalDT(d); }
function addHoursDT(dtStr, hours){ const d = new Date(dtStr); d.setHours(d.getHours()+hours); return toLocalDT(d); }
function fmtDateTime(dtStr){
  if(!dtStr) return '—';
  const d = new Date(dtStr);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}) + ', ' +
         d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function rentalDays(startStr,endStr){
  const start = new Date(startStr), end = new Date(endStr);
  return daysCeilGrace(end-start);
}
function daysCeilGrace(ms){
  const days = ms/86400000;
  const wholeDays = Math.floor(days);
  const overHours = (days-wholeDays)*24;
  if(DB.settings.graceHour && wholeDays>=1 && overHours>0 && overHours<=1) return wholeDays;
  return Math.max(1, Math.ceil(days));
}
// Доплата за опоздание с возвратом, если включён режим 6-часовых блоков:
// первый час опоздания — без доплаты (льготный), после него доплата начисляется
// 6-часовыми блоками по цене "за 6 часов" машины.
function overdueSurcharge(ct){
  if(!DB.settings.overdue6hBlocks) return 0;
  if(!ct || !ct.end || ct.status!=='active') return 0;
  const now = new Date(), end = new Date(ct.end);
  const overMs = now - end;
  const graceMs = 3600*1000;
  if(overMs <= graceMs) return 0;
  const car = DB.cars.find(c=>c.id===ct.carId);
  const rate6h = car?.rate6h || 0;
  if(!rate6h) return 0;
  const blockMs = 6*3600*1000;
  const blocks = Math.ceil((overMs - graceMs)/blockMs);
  return blocks * rate6h;
}

function timeLeftLabel(endStr){
  const diffMs = new Date(endStr) - new Date();
  const abs = Math.abs(diffMs);
  const totalMin = Math.floor(abs/60000);
  const d = Math.floor(totalMin/1440), h = Math.floor((totalMin%1440)/60), m = totalMin%60;
  let text;
  if(d>0) text = `${d} д ${h} ч`;
  else if(h>0) text = `${h} ч ${m} мин`;
  else text = `${m} мин`;
  return diffMs>=0 ? { text:'Осталось '+text, overdue:false } : { text:'Просрочено на '+text, overdue:true };
}
function elapsedLabel(startStr){
  const diffMs = Math.max(0, new Date() - new Date(startStr));
  const totalMin = Math.floor(diffMs/60000);
  const d = Math.floor(totalMin/1440), h = Math.floor((totalMin%1440)/60), m = totalMin%60;
  if(d>0) return `${d} д ${h} ч`;
  if(h>0) return `${h} ч ${m} мин`;
  return `${m} мин`;
}

function safeGet(key){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function persist(key){
  try{
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(DB[key]));
  }catch(e){ console.error('save error', key, e); showToast('Ошибка сохранения — освободите память браузера'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.classList.remove('show'), 1800);
  const kind = /удал|отмен|ошибк|не удалось|нельзя/i.test(msg) ? 'error'
    : /укажите|выберите|заполните|сначала|опишите/i.test(msg) ? 'warning'
    : 'success';
  feedback(kind);
}

function render(){

  let restoreId = null, selStart = null, selEnd = null;
  if(active && main.contains(active) && active.id){
    restoreId = active.id;
    if(typeof active.selectionStart === 'number'){
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }
  if(currentTab==='dashboard') main.innerHTML = renderDashboard();
  else if(currentTab==='cars') main.innerHTML = renderCars();
  else if(currentTab==='clients') main.innerHTML = renderClients();
  else if(currentTab==='contracts') main.innerHTML = renderContracts();
  else if(currentTab==='reports') main.innerHTML = renderReports();

    const el = document.getElementById(restoreId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}

}

/* =================== NOTIFICATIONS =================== */
function computeNotifications(){
  const list = [];
  DB.contracts.forEach(ct=>{
    if(ct.status!=='active') return;
    const tl = timeLeftLabel(ct.end);
    if(tl.overdue){
      const car = DB.cars.find(c=>c.id===ct.carId);
      const cl = DB.clients.find(c=>c.id===ct.clientId);
      list.push({
        key:`overdue:${ct.id}`, type:'overdue', icon:'⏰',
        title:`Просрочен возврат: ${car?esc(car.make+' '+car.model):'машина'}`,
        subtitle:`${cl?esc(cl.name):'Клиент удалён'} · ${tl.text}`,
        onclick:`openContractDetail('${ct.id}')`
      });
    }
  });
  DB.cars.forEach(car=>{
    const { dueSoon, reminderDue, remaining } = oilStatus(car);
    if(dueSoon){
      list.push({
        key:`oil:${car.id}`, type:'oil', icon:'🛢',
        title:`Пора менять масло: ${esc(car.make+' '+car.model)}`,
        subtitle: remaining!=null ? `Просрочено на ${Math.abs(remaining).toLocaleString('ru-RU')} км` : 'Проверьте пробег',
        onclick:`openOilChangeForm('${car.id}')`
      });
    } else if(reminderDue){
      list.push({
        key:`oil-reminder:${car.id}`, type:'oil-reminder', icon:'🔔',
        title:`Проверить пробег: ${esc(car.make+' '+car.model)}`,
        subtitle:'Напоминание по времени о замене масла',
        onclick:`openRecordMileage('${car.id}')`
      });
    }
  });
  DB.clients.forEach(cl=>{
    const { debt } = clientDebt(cl.id);
    if(debt>0){
      list.push({
        key:`debt:${cl.id}`, type:'debt', icon:'⚠️',
        title:`Долг клиента: ${esc(cl.name)}`,
        subtitle:`${money(debt)}`,
        onclick:`openClientDetail('${cl.id}')`
      });
    }
  });
  return list;
}
function isNotifRead(key){
  return (DB.settings.readNotifKeys||[]).includes(key);
}
function updateNotifBadge(){
  const badge = document.getElementById('notifBadge');

  if(count>0){ badge.textContent = count>99?'99+':count; badge.style.display = 'flex'; }

/* =================== REVENUE ENGINE =================== */
// Prorates each contract's total across the days it covers, then buckets by day.
function dailyRevenueMap(){
  const map = {}; // 'YYYY-MM-DD' -> amount
  DB.contracts.forEach(ct=>{
    if(ct.status==='cancelled') return;
    if(ct.type && ct.type!=='rental') return;
    const days = rentalDays(ct.start, ct.end);
    const perDay = (ct.total || 0) / days;
    let d = new Date(ct.start);
    d.setHours(0,0,0,0);
    for(let i=0;i<days;i++){
      const key = toISO(d);
      map[key] = (map[key]||0) + perDay;
      d.setDate(d.getDate()+1);
    }
  });
  return map;
}
function dailyExpenseMap(){
  const map = {}; // 'YYYY-MM-DD' -> amount, repair costs only
  DB.contracts.forEach(ct=>{
    if(ct.type!=='repair') return;
    const key = dateOnly(ct.start);
    map[key] = (map[key]||0) + (ct.total||0);
  });
  return map;
}
function sumRange(map, startISO, endISO){
  let sum = 0;
  for(const k in map){ if(k>=startISO && k<=endISO) sum += map[k]; }
  return sum;
}
function periodRange(period){
  const now = new Date();
  if(period==='week'){
    const day = (now.getDay()+6)%7; // Monday start
    const start = new Date(now); start.setDate(now.getDate()-day);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return [toISO(start), toISO(end)];
  }
  if(period==='month'){
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return [toISO(start), toISO(end)];
  }
  if(period==='year'){
    const start = new Date(now.getFullYear(),0,1);
    const end = new Date(now.getFullYear(),11,31);
    return [toISO(start), toISO(end)];
  }
  // all time
  const dates = DB.contracts.map(c=>dateOnly(c.start)).sort();
  const start = dates.length ? dates[0] : toISO(now);
  return [start, toISO(now)];
}

/* =================== DASHBOARD =================== */
function renderDashboard(){
  const showGauge = DB.settings.showRevenueGauge !== false;
  let gaugeHtml = '';
  if(showGauge){
    const map = dailyRevenueMap();
    const [s,e] = periodRange(gaugePeriod);
    const revenue = sumRange(map, s, e);
    const maxRef = { week: 30000, month: 120000, year: 1200000 }[gaugePeriod] || 100000;
    // dynamic scale: use the greater of a sane baseline or 1.3x current revenue
    const scaleMax = Math.max(maxRef, revenue*1.15, 1000);
    const pct = Math.min(1, revenue/scaleMax);
    const angle = pct * 180; // degrees across the semicircle
    const gaugeSvg = buildGauge(angle);
    const periodLabel = {week:'за неделю', month:'за месяц', year:'за год'}[gaugePeriod];
    gaugeHtml = `
    <div class="dash-top">
      <div class="revenue-card">
        <div class="revenue-eyebrow">Выручка ${periodLabel}</div>
        <div class="revenue-value">${money(revenue)}</div>
        <div class="gauge-wrap">${gaugeSvg}</div>
        <div class="gauge-period-row">
          <button class="${gaugePeriod==='week'?'active':''}" onclick="gaugePeriod='week';render()">Неделя</button>
          <button class="${gaugePeriod==='month'?'active':''}" onclick="gaugePeriod='month';render()">Месяц</button>
          <button class="${gaugePeriod==='year'?'active':''}" onclick="gaugePeriod='year';render()">Год</button>
        </div>
      </div>
    </div>`;
  }

  return `
    ${gaugeHtml}

    ${renderDashboardCards()}
  `;
}
const DASHBOARD_CARD_IDS_ALL = ['income','clientDebt','overdueDebt','monthAgedDebt','finesUnpaid','finesPaid','repairExpense'];

function dashboardPeriodRange(filter){
  if(filter.mode==='week') return periodRange('week');
  if(filter.mode==='month') return periodRange('month');
  if(filter.mode==='custom'){ const f=filter.from||todayISO(), t=filter.to||todayISO(); return f<=t?[f,t]:[t,f]; }
  return [null,null]; // 'all'
}

function dashboardCardDefs(){
  const [s,e] = dashboardPeriodRange(dashboardFilter);
  const inRange = d => !s || (dateOnly(d)>=s && dateOnly(d)<=e);
  const totalIncome = DB.contracts.filter(c=>(!c.type||c.type==='rental') && c.status!=='cancelled' && inRange(c.start)).reduce((s2,c)=>s2+(c.total||0),0);
  const totalClientDebt = DB.clients.reduce((s2,cl)=>{ const {debt}=clientDebt(cl.id); return s2+Math.max(0,debt); },0);
  const now = new Date();
  const overdueDebt = DB.contracts.filter(c=>(!c.type||c.type==='rental') && c.status==='active' && new Date(c.end) < now)
    .reduce((s2,c)=>s2+(c.total||0)+overdueSurcharge(c),0);
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate()-30);
  let monthAgedDebt = 0;
  DB.contracts.filter(c=>(!c.type||c.type==='rental') && c.status!=='cancelled' && !c.paid && new Date(c.start) < cutoff)
    .forEach(c=>{ monthAgedDebt += c.total||0; });
  DB.contracts.filter(c=>c.type==='fine' && new Date(c.start) < cutoff)
    .forEach(c=>{ monthAgedDebt += Math.max(0, (c.total||0)-finePaidAmount(c.id)); });
  const fineContracts = DB.contracts.filter(c=>c.type==='fine' && inRange(c.start));
  const finesUnpaid = fineContracts.reduce((s2,c)=>s2+Math.max(0,(c.total||0)-finePaidAmount(c.id)),0);
  const finesPaid = fineContracts.reduce((s2,c)=>s2+Math.min(c.total||0, finePaidAmount(c.id)),0);
  const repairExpense = DB.contracts.filter(c=>c.type==='repair' && inRange(c.start)).reduce((s2,c)=>s2+(c.total||0),0);
  return {
    income: { icon:'💰', label:'Общий доход', value: money(totalIncome), cls:'c-income', iconCls:'icon-teal' },
    clientDebt: { icon:'⚠️', label:'Долг клиентов', value: money(totalClientDebt), cls: totalClientDebt>0?'c-warn':'', iconCls:'icon-orange' },
    overdueDebt: { icon:'⏰', label:'Просроченные долги', value: money(overdueDebt), cls: overdueDebt>0?'c-warn':'', iconCls:'icon-red' },
    monthAgedDebt: { icon:'📆', label:'Долги старше месяца', value: money(monthAgedDebt), cls: monthAgedDebt>0?'c-warn':'', iconCls:'icon-purple' },
    finesUnpaid: { icon:'🔴', label:'Штрафы неоплаченные', value: money(finesUnpaid), cls: finesUnpaid>0?'c-warn':'', iconCls:'icon-red' },
    finesPaid: { icon:'✅', label:'Штрафы оплаченные', value: money(finesPaid), cls:'c-income', iconCls:'icon-teal' },
    repairExpense: { icon:'🔧', label:'Расход на ремонт', value: money(repairExpense), cls:'c-warn', iconCls:'icon-blue' },
  };
}

  DB.settings.finStatsSwipe = on;
  await persist('settings');
  if(currentTab==='reports') switchTab('dashboard');
  else render();
}
async function moveDashboardCard(id, dir){
  const order = dashboardCardOrder();
  const idx = order.indexOf(id);
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=order.length) return;
  [order[idx],order[newIdx]] = [order[newIdx],order[idx]];
  DB.settings.dashboardCardOrder = order;
  await persist('settings');
  openDashboardCustomize();
}
async function removeDashboardCard(id){
  const order = dashboardCardOrder().filter(x=>x!==id);
  DB.settings.dashboardCardOrder = order;
  await persist('settings');
  openDashboardCustomize();
}
async function addDashboardCard(id){
  const order = dashboardCardOrder();
  if(!order.includes(id)) order.push(id);
  DB.settings.dashboardCardOrder = order;
  await persist('settings');
  openDashboardCustomize();
}
function buildGauge(angleDeg){
  // semicircle gauge, 220x130 viewport, center (110,120), radius 95
  const cx=110, cy=120, r=95;
  const startA = 180, endA = 0; // sweep from 180deg (left) to 0deg (right) along top
  const needleA = 180 - angleDeg;
  const rad = a => a * Math.PI/180;
  const arcPoint = (a,rr) => [cx + rr*Math.cos(rad(a)), cy - rr*Math.sin(rad(a))];
  const [nx,ny] = arcPoint(needleA, r-14);
  // track arc path
  const [sx,sy] = arcPoint(180, r);
  const [ex,ey] = arcPoint(0, r);
  const trackPath = `M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey}`;
  const arcLen = Math.PI*r;
  const fillLen = arcLen * (angleDeg/180);
  const ticks = [0,45,90,135,180].map(a=>{
    const [x1,y1]=arcPoint(a,r+3); const [x2,y2]=arcPoint(a,r-8);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--border)" stroke-width="2" stroke-linecap="round"/>`;
  }).join('');
  return `
  <svg viewBox="0 0 220 130">
    <path d="${trackPath}" fill="none" stroke="var(--surface-3)" stroke-width="12" stroke-linecap="round"/>
    <path d="${trackPath}" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${fillLen} ${arcLen}"/>
    ${ticks}
    <defs>
      <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--accent-2)"/>
        <stop offset="55%" stop-color="var(--accent)"/>
        <stop offset="100%" stop-color="var(--accent)"/>
      </linearGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--text)"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function renderCars(){
  const filters = [['all','Все'],['free','Свободны'],['rented','В аренде'],['booked','Забронированы'],['service','Ремонт']];
  const counts = { all: DB.cars.length, free:0, rented:0, booked:0, service:0 };
  DB.cars.forEach(c=>{ if(counts[c.status]!==undefined) counts[c.status]++; });
  let list = DB.cars.filter(c=>{
    if(carFilter!=='all' && c.status!==carFilter) return false;
    const q = searchQ.cars.toLowerCase();
    if(!q) return true;
    return (c.make+' '+c.model+' '+c.plate).toLowerCase().includes(q);
  });
  return `
    ${(searchBarOpen.cars || searchQ.cars) ? `<div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Поиск по марке, модели, номеру" value="${escapeAttr(searchQ.cars)}" oninput="searchQ.cars=this.value;render()">
    </div>` : ''}
    <div class="chips">${filters.map(([k,l])=>`<div class="chip ${carFilter===k?'active':''}" onclick="carFilter='${k}';render()">${l} <span class="chip-count">${counts[k]}</span></div>`).join('')}</div>
    <div class="section-title">Автопарк <span class="count">${list.length}</span></div>
    ${list.length ? list.map(carCard).join('') : emptyState('Пока нет машин','Нажмите «+», чтобы добавить первую машину в автопарк')}
  `;
}

  const def = CAR_ICONS[key]; if(!def) return '';
  const col = color || CAR_ICON_COLORS[0];
  return `<svg viewBox="0 0 64 40" width="100%" height="100%" style="display:block;"><path d="${def.body}" fill="${col}"/>${def.wheels.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="rgba(0,0,0,0.34)"/>`).join('')}</svg>`;

function selectCarIcon(key){
  document.getElementById('f_car_icon').value = key;
  document.querySelectorAll('.car-icon-opt').forEach(el=>{
    el.classList.toggle('active', el.dataset.icon===key);
  });
  const colorField = document.getElementById('carIconColorField');
  const preview = document.getElementById('carIconPreview');
  if(key){
    colorField.style.display = '';
    const color = document.getElementById('f_car_icon_color').value || CAR_ICON_COLORS[0];
    preview.innerHTML = carIconSvg(key, color);
  } else {
    colorField.style.display = 'none';
  }
}
function selectCarIconColor(color){
  document.getElementById('f_car_icon_color').value = color;
  document.querySelectorAll('.car-color-dot').forEach(el=>{
    el.classList.toggle('active', hexToRgbCss(color)===el.style.background);
  });
  const key = document.getElementById('f_car_icon').value;
  const preview = document.getElementById('carIconPreview');
  if(key) preview.innerHTML = carIconSvg(key, color);
}
function hexToRgbCss(hex){
  const v = hex.replace('#','');
  const r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function applyAppIcon(){
  const key = DB.settings.appIcon;

    const favicon = document.querySelector('link[rel="icon"]');
    const touchIcon = document.querySelector('link[rel="apple-touch-icon"]');

async function finishRepair(carId){
  const ct = DB.contracts.find(c=>c.carId===carId && c.status==='service' && c.type==='repair');

  const car = DB.cars.find(c=>c.id===carId);
  if(car) car.status = 'free';
  await persist('contracts'); await persist('cars');
  closeSheet(); render();
  showToast('Ремонт завершён, машина свободна');
}
async function startBookedRental(contractId){
  const idx = DB.contracts.findIndex(c=>c.id===contractId); if(idx<0) return;
  const ct = DB.contracts[idx];
  ct.status = 'active';
  const car = DB.cars.find(c=>c.id===ct.carId);
  if(car) car.status = 'rented';
  await persist('contracts'); await persist('cars');
  closeSheet(); render();
  showToast('Аренда начата');
}
async function deleteCar(id){

  await persist('cars'); closeSheet(); render(); showCenterConfirm('Машина удалена');

function clientHasActiveRental(clientId){
  return DB.contracts.some(ct=>ct.clientId===clientId && ct.status==='active');
}
function clientHasBooking(clientId){
  return DB.contracts.some(ct=>ct.clientId===clientId && ct.status==='booked');
}
function clientUnpaidFines(clientId){
  return DB.contracts.filter(ct=>ct.clientId===clientId && ct.type==='fine')
    .reduce((s,ct)=>s+Math.max(0,(ct.total||0)-finePaidAmount(ct.id)),0);
}
let clientFilter = 'all';
function renderClients(){
  const filters = [['all','Все'],['rented','В аренде'],['debt','Долги'],['fines','Штрафы'],['booked','Брон'],['blacklist','Чёрный список']];
  const counts = { all: DB.clients.length, rented:0, debt:0, fines:0, booked:0, blacklist:0 };
  DB.clients.forEach(c=>{
    if(clientHasActiveRental(c.id)) counts.rented++;
    if(clientDebt(c.id).debt>0) counts.debt++;
    if(clientUnpaidFines(c.id)>0) counts.fines++;
    if(clientHasBooking(c.id)) counts.booked++;
    if(c.blacklisted) counts.blacklist++;
  });
  let list = DB.clients.filter(c=>{
    if(clientFilter==='rented' && !clientHasActiveRental(c.id)) return false;
    if(clientFilter==='debt' && !(clientDebt(c.id).debt>0)) return false;
    if(clientFilter==='fines' && !(clientUnpaidFines(c.id)>0)) return false;
    if(clientFilter==='booked' && !clientHasBooking(c.id)) return false;
    if(clientFilter==='blacklist' && !c.blacklisted) return false;
    const q = searchQ.clients.toLowerCase();
    if(!q) return true;
    return (c.name+' '+c.phone+' '+(c.doc||'')).toLowerCase().includes(q);
  }).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  return `
    ${(searchBarOpen.clients || searchQ.clients) ? `<div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Поиск по имени, телефону" value="${escapeAttr(searchQ.clients)}" oninput="searchQ.clients=this.value;render()">
    </div>` : ''}
    <div class="chips">${filters.map(([k,l])=>`<div class="chip ${clientFilter===k?'active':''}" onclick="clientFilter='${k}';render()">${l} <span class="chip-count">${counts[k]}</span></div>`).join('')}</div>
    <div class="section-title">Клиенты <span class="count">${list.length}</span></div>
    ${list.length ? list.map(clientCard).join('') : emptyState('Пока нет клиентов','Нажмите «+», чтобы добавить клиента')}
  `;
}
function clientCard(c){
  const rentals = DB.contracts.filter(ct=>ct.clientId===c.id).length;
  const initials = c.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const { debt } = clientDebt(c.id);

function computeClientRating(clientId){
  const rated = DB.contracts.filter(ct=>ct.clientId===clientId && (!ct.type||ct.type==='rental') && ct.rating);
  if(!rated.length) return { avg:0, count:0, rated:[] };
  const avg = rated.reduce((s,ct)=>s+ct.rating,0)/rated.length;
  return { avg, count: rated.length, rated };
}

function clientDebt(clientId){
  const rentals = DB.contracts.filter(ct=>ct.clientId===clientId && ct.status!=='cancelled');
  const unpaidSum = rentals.reduce((s,ct)=> s + (!ct.paid ? ct.total + overdueSurcharge(ct) : 0), 0);
  const ledger = DB.clientLedger.filter(l=>l.clientId===clientId);
  const finesSum = ledger.filter(l=>l.type==='fine').reduce((s,l)=>s+(l.amount||0),0);
  const violationsSum = ledger.filter(l=>l.type==='violation').reduce((s,l)=>s+(l.amount||0),0);
  const oldDebtSum = ledger.filter(l=>l.type==='oldDebt').reduce((s,l)=>s+(l.amount||0),0);
  const paymentsSum = ledger.filter(l=>l.type==='payment').reduce((s,l)=>s+(l.amount||0),0);
  return { unpaidSum, finesSum, violationsSum, oldDebtSum, paymentsSum, debt: unpaidSum + finesSum + violationsSum + oldDebtSum - paymentsSum, ledger };
}

function dayWord(n){
  const n10 = n%10, n100 = n%100;
  if(n100>=11 && n100<=14) return 'дней';
  if(n10===1) return 'день';
  if(n10>=2 && n10<=4) return 'дня';
  return 'дней';
}

  const date = document.getElementById('f_pay_date').value || nowDT();

  await persist('clientLedger');
  const clForMsg = DB.clients.find(x=>x.id===clientId);

/* =================== CONTRACTS =================== */
let contractFilter = 'all';
function renderContracts(){
  const statusOrder = { active:0, service:0, booked:1, done:2, cancelled:2 };
  const isDebt = ct => (!ct.type||ct.type==='rental') && !ct.paid && ct.status!=='cancelled';
  const filters = [['all','Все'],['active','Активные'],['debt','Долги'],['fines','Штрафы'],['oldDebt','Старые долги'],['oil','Замена масла'],['violations','Нарушения']];
  const counts = { all: DB.contracts.length, active:0, debt:0, fines:0, oldDebt:0, oil:0, violations:0 };
  DB.contracts.forEach(ct=>{
    if(ct.status==='active' || ct.status==='service') counts.active++;
    if(isDebt(ct)) counts.debt++;
    if(ct.type==='fine') counts.fines++;
    if(ct.type==='oldDebt') counts.oldDebt++;
    if(ct.type==='oil') counts.oil++;
    if(ct.type==='violation') counts.violations++;
  });
  let list = DB.contracts.filter(ct=>{
    if(contractFilter==='active' && !(ct.status==='active'||ct.status==='service')) return false;
    if(contractFilter==='debt' && !isDebt(ct)) return false;
    if(contractFilter==='fines' && ct.type!=='fine') return false;
    if(contractFilter==='oldDebt' && ct.type!=='oldDebt') return false;
    if(contractFilter==='oil' && ct.type!=='oil') return false;
    if(contractFilter==='violations' && ct.type!=='violation') return false;
    const q = searchQ.contracts.toLowerCase();
    if(!q) return true;
    const car = DB.cars.find(c=>c.id===ct.carId);
    const cl = DB.clients.find(c=>c.id===ct.clientId);
    return ((car?car.make+' '+car.model:'')+' '+(cl?cl.name:'')).toLowerCase().includes(q);
  }).sort((a,b)=>{
    const oa = statusOrder[a.status]??3, ob = statusOrder[b.status]??3;
    if(oa!==ob) return oa-ob;
    // within active/booked: soonest deadline/start first; within done/cancelled: most recently finished first
    // (contract.end is set to the actual completion moment when a rental is finished, so a long-running
    // rental that just ended today still surfaces near the top instead of sinking by its old start date)
    if(a.status==='active') return new Date(a.end) - new Date(b.end);
    if(a.status==='booked') return new Date(a.start) - new Date(b.start);
    return new Date(b.end) - new Date(a.end);
  });
  return `
    ${(searchBarOpen.contracts || searchQ.contracts) ? `<div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Поиск по клиенту, машине" value="${escapeAttr(searchQ.contracts)}" oninput="searchQ.contracts=this.value;render()">
    </div>` : ''}
    <div class="chips">${filters.map(([k,l])=>`<div class="chip ${contractFilter===k?'active':''}" onclick="contractFilter='${k}';render()">${l} <span class="chip-count">${counts[k]}</span></div>`).join('')}</div>
    <div class="section-title">Договоры <span class="count">${list.length}</span></div>
    ${list.length ? list.map(contractCard).join('') : emptyState('Пока нет договоров','Нажмите «+», чтобы оформить первую аренду')}
  `;
}

function setRentalType(type){
  document.getElementById('f_rentalType').value = type;
  document.querySelectorAll('#rentalTypeRow button').forEach(b=>b.classList.remove('active'));
  const btns = document.querySelectorAll('#rentalTypeRow button');
  (type==='daily' ? btns[0] : btns[1]).classList.add('active');
  const carId = document.getElementById('f_car').value;
  const car = DB.cars.find(c=>c.id===carId);
  if(car) document.getElementById('f_crate').value = type==='6h' ? (car.rate6h||car.rate||0) : (car.rate||0);
  const startEl = document.getElementById('f_start');
  if(startEl.value){
    document.getElementById('f_end').value = type==='6h' ? addHoursDT(startEl.value,6) : plusDaysDT(startEl.value,1);
  }

}
