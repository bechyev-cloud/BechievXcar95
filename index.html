<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XCAR">
<meta name="theme-color" content="#14161c">
<meta name="color-scheme" content="dark">
<meta name="description" content="XCAR — учёт автопроката: машины, клиенты, договоры, отчёты, WhatsApp-уведомления">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<title>XCAR — учёт аренды</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  color-scheme:dark;
  --bg:#14161c;
  --surface:#1c2029;
  --surface-2:#242936;
  --surface-3:#2c3242;
  --border:#333a4a;
  --accent:#f2a93b;
  --accent-dim:#7a5b25;
  --accent-2:#3ec9a7;
  --accent-2-dim:#215c4e;
  --danger:#e8604c;
  --text:#eef0f4;
  --text-dim:#9aa0ad;
  --text-faint:#5d6472;
  --header-grad-start:rgba(20,22,28,0.97);
  --header-grad-end:rgba(20,22,28,0);
  --nav-bg:rgba(28,32,41,0.92);
  --overlay-bg:rgba(10,11,14,0.6);
  --card-grad-start:var(--surface);
  --card-grad-end:#1a1e27;
  --shadow-soft:0 1px 0 rgba(255,255,255,0.03) inset, 0 16px 32px -20px rgba(0,0,0,0.65);
  --shadow-card:0 1px 0 rgba(255,255,255,0.02) inset, 0 6px 16px -12px rgba(0,0,0,0.6);
  --shadow-pop:0 8px 20px rgba(0,0,0,0.35);
  --font-display:'Rajdhani',sans-serif;
  --font-body:'Inter',sans-serif;
  --radius:14px;
  --radius-sm:9px;
}
body.theme-light{
  color-scheme:light;
  --bg:#eef1f6;
  --surface:rgba(255,255,255,0.6);
  --surface-2:rgba(255,255,255,0.78);
  --surface-3:rgba(255,255,255,0.92);
  --border:rgba(255,255,255,0.65);
  --accent:#ff9500;
  --accent-dim:#ffd9a3;
  --accent-2:#12b886;
  --accent-2-dim:#c8f3e4;
  --danger:#ff3b30;
  --text:#1c1c1e;
  --text-dim:#6e6e73;
  --text-faint:#a3a3a8;
  --header-grad-start:rgba(238,241,246,0.75);
  --header-grad-end:rgba(238,241,246,0);
  --nav-bg:rgba(255,255,255,0.55);
  --overlay-bg:rgba(30,30,40,0.28);
  --card-grad-start:rgba(255,255,255,0.66);
  --card-grad-end:rgba(255,255,255,0.4);
  --shadow-soft:inset 0 1px 0 rgba(255,255,255,0.9), inset 0 0 0 1px rgba(255,255,255,0.4), 0 16px 40px -18px rgba(60,70,110,0.35);
  --shadow-card:inset 0 1px 0 rgba(255,255,255,0.85), inset 0 0 0 1px rgba(255,255,255,0.35), 0 8px 22px -14px rgba(60,70,110,0.28);
  --shadow-pop:inset 0 1px 0 rgba(255,255,255,0.85), 0 14px 34px -10px rgba(50,60,100,0.3);
  --glass-blur:blur(24px) saturate(190%);
  background:
    radial-gradient(circle at 12% 8%, rgba(255,183,143,0.55), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(147,197,253,0.55), transparent 45%),
    radial-gradient(circle at 15% 88%, rgba(167,243,208,0.5), transparent 45%),
    radial-gradient(circle at 90% 85%, rgba(233,171,247,0.45), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(253,224,171,0.35), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body.theme-light header.top,
body.theme-light .nav-inner,
body.theme-light .overlay,
body.theme-light .card,
body.theme-light .sheet,
body.theme-light .stat-mini,
body.theme-light .summary-card,
body.theme-light .summary-card2,
body.theme-light .dash-quick,
body.theme-light .detail-block,
body.theme-light .quick-action,
body.theme-light .period-custom,
body.theme-light .period-seg,
body.theme-light .revenue-card,
body.theme-light .inline-client-box,
body.theme-light .search-bar,
body.theme-light .chip,
body.theme-light .field input,
body.theme-light .field select,
body.theme-light .field textarea,
body.theme-light .icon-btn,
body.theme-light .btn.ghost{
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
}
body.theme-light .card,
body.theme-light .stat-mini,
body.theme-light .summary-card2,
body.theme-light .dash-quick,
body.theme-light .detail-block,
body.theme-light .revenue-card,
body.theme-light .search-bar,
body.theme-light .period-custom{
  border-color:rgba(255,255,255,0.55);
}
body.theme-light .chip{background:rgba(255,255,255,0.5);border-color:rgba(255,255,255,0.6);}
body.theme-light .chip.active{background:var(--accent);border-color:var(--accent);box-shadow:0 6px 16px -6px rgba(255,149,0,0.55);}
body.theme-light .icon-btn{background:rgba(255,255,255,0.55);border-color:rgba(255,255,255,0.6);}
body.theme-light .btn.primary{box-shadow:0 8px 20px -8px rgba(255,149,0,0.55);}
body.theme-light .btn.ghost{background:rgba(255,255,255,0.55);}
body.theme-light #app{background:transparent;}
body.theme-light .splash{background:transparent;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overscroll-behavior:none;}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:
  radial-gradient(circle at 50% -10%, #1e2330 0%, var(--bg) 55%);}

/* ---------- splash / welcome screen ---------- */
.splash{
  position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 20%, #232838 0%, var(--bg) 60%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:opacity .45s ease, visibility .45s ease;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-glow{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:600px;
  background:radial-gradient(circle, rgba(242,169,59,0.16), transparent 65%);border-radius:50%;}
.splash-inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 32px;}
.splash-mark{
  width:84px;height:84px;border-radius:22px;
  background:conic-gradient(from 220deg, var(--accent), #ffcf7a, var(--accent));
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;
  box-shadow:0 0 0 1px rgba(242,169,59,0.25), 0 16px 40px -10px rgba(242,169,59,0.5);
}
.splash-mark svg{width:42px;height:42px;}
.splash-title{font-family:var(--font-display);font-weight:700;font-size:44px;letter-spacing:2px;}
.splash-sub{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-top:10px;max-width:280px;}
.splash-btn{
  margin-top:34px;display:flex;align-items:center;gap:10px;padding:15px 26px;border-radius:100px;border:none;
  background:linear-gradient(155deg, #ffc266, var(--accent));color:#241a06;font-family:var(--font-body);font-weight:700;font-size:14.5px;
  cursor:pointer;box-shadow:0 10px 26px -8px rgba(242,169,59,0.55);transition:transform .15s;
}
.splash-btn:active{transform:scale(0.97);}
.splash-btn svg{width:18px;height:18px;}

/* ---------- tablet & desktop wide Chrome layout ---------- */
@media (min-width: 700px){
  #app{max-width:1180px;}
  header.top{padding:20px 30px 15px;}
  #headerAddBtn{display:flex !important;}
  .fab{display:none;}
  main{padding:6px 30px 60px;display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:14px;align-content:start;}
  main > .search-bar, main > .chips, main > .section-title, main > .dash-top, main > .empty{grid-column:1 / -1;}
  main > .card{margin-bottom:0;}
  nav.bottom .nav-inner{max-width:1180px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));}
  .dash-top{flex-direction:row;align-items:stretch;}
  .dash-top .revenue-card{flex:1.3;}
  .dash-top .quick-stats{flex:1;display:flex;flex-direction:column;justify-content:center;}
}
@media (min-width: 1000px){
  main{grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));}
}

/* ---------- Windows mode (manual toggle: wide layout + left sidebar nav) ---------- */
body.win-mode #app{max-width:none;margin:0 0 0 216px;width:calc(100% - 216px);}
body.win-mode header.top{padding:20px 26px 15px;}
body.win-mode #headerAddBtn{display:flex !important;}
body.win-mode main{
  padding:6px 26px 30px;display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
  gap:14px;align-content:start;
}
body.win-mode main > .search-bar, body.win-mode main > .chips, body.win-mode main > .section-title,
body.win-mode main > .dash-top, body.win-mode main > .empty{grid-column:1 / -1;}
body.win-mode main > .card{margin-bottom:0;}
body.win-mode .dash-top{flex-direction:row;align-items:stretch;}
body.win-mode .dash-top .revenue-card{flex:1.3;}
body.win-mode .dash-top .quick-stats{flex:1;display:flex;flex-direction:column;justify-content:center;}
body.win-mode .fab{display:none;}
body.win-mode nav.bottom{
  left:0;right:auto;top:0;bottom:0;width:216px;height:100vh;height:100dvh;justify-content:flex-start;
}
body.win-mode .nav-inner{
  flex-direction:column;max-width:216px;width:216px;height:100%;
  justify-content:flex-start;align-items:stretch;gap:6px;
  padding:22px 12px;border-top:none;border-right:1px solid var(--border);
  overflow-y:auto;
}
body.win-mode .nav-btn{
  flex-direction:row;justify-content:flex-start;gap:12px;
  padding:11px 14px;border-radius:10px;transition:background .15s;
}
body.win-mode .nav-btn:hover{background:var(--surface-2);}
body.win-mode .nav-btn span{font-size:13.5px;}
body.win-mode .nav-btn.active{background:rgba(242,169,59,0.13);}
body.win-mode .nav-btn.active:hover{background:rgba(242,169,59,0.13);}
body.win-mode .nav-btn.active::after{display:none;}
body.win-mode .overlay{padding-left:216px;}

/* ---------- header ---------- */
header.top{
  padding:calc(18px + env(safe-area-inset-top)) 18px 14px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--header-grad-start) 70%, var(--header-grad-end));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:conic-gradient(from 220deg, var(--accent), #ffcf7a, var(--accent));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(242,169,59,0.25), 0 6px 16px -4px rgba(242,169,59,0.45);
}
.brand-mark svg{width:20px;height:20px;}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:0.3px;line-height:1;}
.brand-sub{font-size:10.5px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:active{background:var(--surface-3);}
.notif-badge{
  position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;
  background:var(--danger);color:#fff;border-radius:100px;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;line-height:1;border:2px solid var(--bg);
}

/* ---------- main scroll area ---------- */
main{flex:1;padding:4px 16px calc(110px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;}
.section-title{
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:0.5px;
  text-transform:uppercase;color:var(--text-dim);margin:22px 2px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;
}
.section-title::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px;display:inline-block;}
.section-title span.count{color:var(--text-faint);font-weight:600;}

/* ---------- dashboard revenue card (signature element) ---------- */
.dash-top{display:flex;flex-direction:column;gap:12px;}
.revenue-card{
  background:linear-gradient(160deg, var(--surface-2) 0%, var(--surface) 75%);
  border:1px solid var(--border);border-radius:22px;padding:24px 20px 16px;
  display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;
  box-shadow:var(--shadow-soft);
}
.revenue-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% -8%, rgba(242,169,59,0.16), transparent 62%);
  pointer-events:none;
}
.revenue-card::after{
  content:"";position:absolute;top:0;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);opacity:0.65;
}
.revenue-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-dim);position:relative;}
.revenue-value{
  font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:0.3px;margin-top:4px;position:relative;
  background:linear-gradient(160deg,#ffffff,#f2a93b 130%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.gauge-wrap{position:relative;width:220px;height:130px;margin-top:6px;}
.gauge-wrap svg{width:100%;height:100%;}
.gauge-period-row{display:flex;gap:6px;margin-top:6px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:11px;position:relative;}
.gauge-period-row button{
  border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-weight:600;font-size:12px;
  padding:7px 14px;border-radius:8px;cursor:pointer;
}
.gauge-period-row button.active{background:var(--accent);color:#241a06;}

.quick-stats{display:block;padding:16px 14px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.stat-mini{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.stat-mini .n{font-family:var(--font-display);font-weight:700;font-size:19px;}
.stat-mini .l{font-size:11px;color:var(--text-dim);margin-top:2px;}
.stat-mini.warn .n{color:var(--accent);}
.stat-mini.good .n{color:var(--accent-2);}

.dash-quick{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2px 16px;}
.dq-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.dq-item:last-child{border-bottom:none;}
.dq-left{display:flex;align-items:center;gap:11px;color:var(--text-dim);font-size:13px;font-weight:600;min-width:0;}
.dq-n{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text);flex-shrink:0;}
.dq-item.warn .dq-n{color:var(--danger);}
.dq-item.good .dq-n{color:var(--accent-2);}

.icon-badge{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(62,201,167,0.14);color:var(--accent-2);flex-shrink:0;
}
.icon-badge svg{width:16px;height:16px;}
.icon-badge.warn{background:rgba(124,131,253,0.14);color:#8e97ff;}
.icon-badge.danger{background:rgba(232,96,76,0.14);color:var(--danger);}

/* ---------- cards list ---------- */
.card{
  background:linear-gradient(160deg, var(--card-grad-start) 0%, var(--card-grad-end) 100%);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;
  transition:border-color .15s, transform .1s, box-shadow .15s;
  box-shadow:var(--shadow-card);
}
.card:active{border-color:var(--accent-dim);background:var(--surface-2);transform:scale(0.99);}
.card.rented-glow{border-color:rgba(242,169,59,0.35);box-shadow:0 0 0 1px rgba(242,169,59,0.08) inset, 0 6px 18px -10px rgba(242,169,59,0.25);}
.card.overdue-glow{border-color:rgba(232,96,76,0.5);box-shadow:0 0 0 1px rgba(232,96,76,0.1) inset, 0 6px 18px -10px rgba(232,96,76,0.35);}
.card-avatar{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg, var(--surface-3), #232838);color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:15px;
  border:1px solid rgba(242,169,59,0.12);
}
.card-body{flex:1;min-width:0;}
.card-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;}
.card-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.card-right{text-align:right;flex-shrink:0;}
.card-amount{font-family:var(--font-display);font-weight:700;font-size:15px;}
.chev{color:var(--text-faint);width:16px;height:16px;flex-shrink:0;}

.badge{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:0.4px;
  display:inline-block;line-height:1.4;
}
.badge.free{background:rgba(62,201,167,0.14);color:var(--accent-2);}
.badge.rented{background:rgba(242,169,59,0.16);color:var(--accent);}
.badge.booked{background:rgba(124,131,253,0.16);color:#8e97ff;}
.badge.service{background:rgba(232,96,76,0.15);color:var(--danger);}
.badge.active{background:rgba(242,169,59,0.16);color:var(--accent);}
.badge.done{background:rgba(154,160,173,0.15);color:var(--text-dim);}
.badge.cancelled{background:rgba(232,96,76,0.15);color:var(--danger);}
.badge.paid{background:rgba(62,201,167,0.14);color:var(--accent-2);}
.badge.unpaid{background:rgba(232,96,76,0.15);color:var(--danger);}

.timer-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px 4px 7px;border-radius:100px;
  background:rgba(242,169,59,0.12);color:var(--accent);letter-spacing:0.2px;
}
.timer-pill.overdue{background:rgba(232,96,76,0.16);color:var(--danger);}
.timer-pill svg{width:11px;height:11px;flex-shrink:0;}
.card-actions{display:flex;gap:8px;margin-top:8px;}
.mini-btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:11.5px;font-weight:700;
  padding:7px 12px;border-radius:100px;cursor:pointer;
}
.mini-btn.finish{background:var(--accent);color:#241a06;border-color:var(--accent);}
.mini-btn.finish:active{background:#d99a30;}
.mini-icon-btn{
  margin-top:8px;width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.mini-icon-btn svg{width:14px;height:14px;}
.mini-icon-btn:active{background:var(--accent-dim);}

.empty{
  text-align:center;padding:44px 20px;color:var(--text-dim);
}
.empty svg{width:38px;height:38px;color:var(--text-faint);margin-bottom:10px;}
.empty .t{font-weight:600;color:var(--text);margin-bottom:4px;font-size:14.5px;}
.empty .d{font-size:12.5px;line-height:1.5;}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:4px;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:7px 13px;border-radius:100px;background:var(--surface);border:1px solid var(--border);
  font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;
}
.chip.active{background:var(--accent);color:#241a06;border-color:var(--accent);}
.chip-count{
  display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;
  background:rgba(255,255,255,0.12);border-radius:100px;font-size:10px;font-weight:800;margin-left:2px;
}
.chip.active .chip-count{background:rgba(36,26,6,0.25);}

.period-seg{
  display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;
  padding:3px;gap:2px;margin:10px 0 2px;
}
.period-seg button{
  flex:1;border:none;background:none;padding:8px 4px;border-radius:100px;font-size:12px;font-weight:700;
  color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s;font-family:var(--font-body);
}
.period-seg button.active{background:var(--accent);color:#241a06;box-shadow:0 2px 8px rgba(242,169,59,0.35);}
.period-custom{
  display:flex;align-items:center;gap:8px;margin:10px 0 4px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:10px 12px;
}
.period-custom input{
  flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 9px;
  color:var(--text);font-size:16px;font-family:var(--font-body);outline:none;min-width:0;
}
.period-custom span{color:var(--text-faint);font-size:12px;flex-shrink:0;}
.summary-row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 6px;}
.summary-card{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:11px 4px 9px;
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
.summary-card .ic{font-size:16px;line-height:1;margin-bottom:4px;}
.summary-card .n{font-family:var(--font-display);font-weight:800;font-size:12.5px;color:var(--text);line-height:1.15;word-break:break-word;}
.summary-card .l{font-size:9px;color:var(--text-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.3px;line-height:1.2;}
.summary-card.c-income .n{color:var(--accent-2);}
.summary-card.c-warn .n{color:var(--danger);}
.summary-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px;}
.summary-card2{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px;
  display:flex;flex-direction:column;gap:4px;
}
.summary-card2 .ic{font-size:17px;line-height:1;}
.summary-card2 .n{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--text);word-break:break-word;}
.summary-card2 .l{font-size:11px;color:var(--text-dim);}
.summary-card2.c-income .n{color:var(--accent-2);}
.summary-card2.c-warn .n{color:var(--danger);}

/* search */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:12px;}
.search-bar svg{width:16px;height:16px;color:var(--text-faint);flex-shrink:0;}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-size:16px;width:100%;font-family:var(--font-body);}
.search-bar input::placeholder{color:var(--text-faint);}

/* ---------- report ---------- */
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding:10px 4px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-fill{width:100%;max-width:26px;border-radius:5px 5px 3px 3px;background:linear-gradient(180deg, var(--accent), var(--accent-dim));min-height:3px;}
.bar-label{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.3px;}
.report-row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--border);}
.report-row:last-child{border-bottom:none;}
.report-row .rl{font-size:13.5px;color:var(--text-dim);}
.report-row .rv{font-family:var(--font-display);font-weight:700;font-size:14.5px;}

/* ---------- bottom nav ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
}
.nav-inner{
  max-width:520px;width:100%;display:flex;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--text-faint);
  background:none;border:none;font-family:var(--font-body);cursor:pointer;position:relative;
}
.nav-btn svg{width:21px;height:21px;}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:0.2px;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 1px rgba(242,169,59,0.7);}

.fab{
  position:fixed;right:calc(50% - 260px + 18px);bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;
  width:54px;height:54px;border-radius:16px;background:var(--accent);border:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(242,169,59,0.55);
  cursor:pointer;
}
@media (max-width:559px){ .fab{right:18px;} }
.fab svg{width:24px;height:24px;color:#241a06;}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:var(--overlay-bg);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex;}
.sheet{
  width:100%;max-width:520px;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:22px 22px 0 0;
  border:1px solid var(--border);border-bottom:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:10px;margin:10px auto 4px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;}
.sheet-head-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sheet-title{font-family:var(--font-display);font-weight:700;font-size:18px;}
.sheet-body{padding:6px 18px calc(26px + env(safe-area-inset-bottom));}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;
  color:var(--text);font-size:16px;font-family:var(--font-body);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-dim);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field textarea{resize:vertical;min-height:60px;}
.field input[type="range"]{
  width:100%;padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;height:20px;
}
.field input[type="range"]::-webkit-slider-runnable-track{height:5px;border-radius:100px;background:var(--surface-3);}
.field input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;background:var(--accent);
  border:2px solid #241a06;margin-top:-7px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.4);
}
.field input[type="range"]::-moz-range-track{height:5px;border-radius:100px;background:var(--surface-3);}
.field input[type="range"]::-moz-range-thumb{
  width:19px;height:19px;border-radius:50%;background:var(--accent);border:2px solid #241a06;cursor:pointer;
}

.btn{
  width:100%;padding:14px;border-radius:12px;border:none;font-family:var(--font-body);font-weight:700;font-size:14.5px;
  cursor:pointer;text-align:center;transition:transform .1s;
}
.btn:active{transform:scale(0.98);}
.btn.primary{background:linear-gradient(155deg, #ffc266, var(--accent));color:#241a06;box-shadow:0 8px 18px -8px rgba(242,169,59,0.55);}
.btn.primary:active{background:#d99a30;}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn.danger-ghost{background:rgba(232,96,76,0.1);color:var(--danger);border:1px solid rgba(232,96,76,0.3);}
.btn.good{background:linear-gradient(155deg, #5fe0bd, var(--accent-2));color:#0c2b23;box-shadow:0 8px 18px -8px rgba(62,201,167,0.5);}
.btn-row{display:flex;gap:10px;margin-top:6px;}
.btn-row .btn{flex:1;}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
.quick-action{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 4px;
  cursor:pointer;transition:background .15s,transform .1s;
}
.quick-action:active{background:var(--surface-3);transform:scale(0.97);}
.quick-action .ic{font-size:17px;line-height:1;}
.quick-action .lb{font-size:10px;font-weight:700;color:var(--text-dim);text-align:center;line-height:1.15;}

.detail-block{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
.star-picker{display:flex;gap:3px;}
.star-picker .star{font-size:20px;color:var(--border);cursor:pointer;line-height:1;user-select:none;}
.star-picker .star.filled{color:var(--accent);}
.stars-display{color:var(--accent);letter-spacing:1px;font-size:12px;}
.detail-row .k{color:var(--text-dim);}
.detail-row .v{font-weight:600;text-align:right;}

.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface-3);
  border:1px solid var(--border);padding:11px 18px;border-radius:100px;font-size:13px;font-weight:600;
  z-index:80;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;box-shadow:var(--shadow-pop);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--border);}
.settings-item:last-child{border-bottom:none;}
.settings-item .st{font-size:14px;font-weight:600;}
.count-badge{
  background:var(--surface-3);color:var(--text-dim);font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:100px;min-width:20px;text-align:center;line-height:1.4;
}
.count-badge.warn{background:rgba(232,96,76,0.15);color:var(--danger);}
.settings-item .sd{font-size:12px;color:var(--text-dim);margin-top:2px;}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--surface-3);border-radius:100px;transition:.2s;border:1px solid var(--border);}
.switch .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:2.5px;background:#cfd3db;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--accent-dim);border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(18px);background:var(--accent);}
</style>
</head>

<script>
/* =================== STORAGE / STATE =================== */
let DB = { cars: [], clients: [], contracts: [], clientLedger: [], oilChanges: [], settings: { currency: '₽', lastBackupAt: null } };
let currentTab = 'dashboard';
let gaugePeriod = 'month';
let reportCategory = 'income';
let searchQ = { cars:'', clients:'', contracts:'' };
let carFilter = 'all';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => (Math.round(n||0)).toLocaleString('ru-RU') + ' ' + DB.settings.currency;
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}); };
const toISO = d => new Date(d).toISOString().slice(0,10);
const todayISO = () => toISO(new Date());
const dateOnly = s => (s||'').slice(0,10);
const SHEET_ICONS = {
  edit: `<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>`,
  image: `<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>`,
  send: `<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>`,
  plus: `<path d="M12 5v14M5 12h14"/>`,
  check: `<path d="M20 6 9 17l-5-5"/>`,
  list: `<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>`,
  trash: `<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14Z"/><path d="M10 11v6M14 11v6"/>`,
  close: `<path d="M18 6 6 18M6 6l12 12"/>`
};
function iconBtn(icon, onclick, title){
  return `<button class="icon-btn" title="${title}" onclick="${onclick}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SHEET_ICONS[icon]}</svg></button>`;
}
// 'YYYY-MM-DDTHH:MM' for datetime-local inputs, in local time (not UTC)
function toLocalDT(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function nowDT(){ return toLocalDT(new Date()); }
function plusDaysDT(dtStr, days){ const d = new Date(dtStr); d.setDate(d.getDate()+days); return toLocalDT(d); }
function addHoursDT(dtStr, hours){ const d = new Date(dtStr); d.setHours(d.getHours()+hours); return toLocalDT(d); }
function fmtDateTime(dtStr){
  if(!dtStr) return '—';
  const d = new Date(dtStr);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}) + ', ' +
         d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function rentalDays(startStr,endStr){
  const start = new Date(startStr), end = new Date(endStr);
  return daysCeilGrace(end-start);
}
function daysCeilGrace(ms){
  const days = ms/86400000;
  const wholeDays = Math.floor(days);
  const overHours = (days-wholeDays)*24;
  if(DB.settings.graceHour && wholeDays>=1 && overHours>0 && overHours<=1) return wholeDays;
  return Math.max(1, Math.ceil(days));
}

function timeLeftLabel(endStr){
  const diffMs = new Date(endStr) - new Date();
  const abs = Math.abs(diffMs);
  const totalMin = Math.floor(abs/60000);
  const d = Math.floor(totalMin/1440), h = Math.floor((totalMin%1440)/60), m = totalMin%60;
  let text;
  if(d>0) text = `${d} д ${h} ч`;
  else if(h>0) text = `${h} ч ${m} мин`;
  else text = `${m} мин`;
  return diffMs>=0 ? { text:'Осталось '+text, overdue:false } : { text:'Просрочено на '+text, overdue:true };
}
function elapsedLabel(startStr){
  const diffMs = Math.max(0, new Date() - new Date(startStr));
  const totalMin = Math.floor(diffMs/60000);
  const d = Math.floor(totalMin/1440), h = Math.floor((totalMin%1440)/60), m = totalMin%60;
  if(d>0) return `${d} д ${h} ч`;
  if(h>0) return `${h} ч ${m} мин`;
  return `${m} мин`;
}

function safeGet(key){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function persist(key){
  try{
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(DB[key]));
  }catch(e){ console.error('save error', key, e); showToast('Ошибка сохранения — освободите память браузера'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* =================== NOTIFICATIONS =================== */
function computeNotifications(){
  const list = [];
  DB.contracts.forEach(ct=>{
    if(ct.status!=='active') return;
    const tl = timeLeftLabel(ct.end);
    if(tl.overdue){
      const car = DB.cars.find(c=>c.id===ct.carId);
      const cl = DB.clients.find(c=>c.id===ct.clientId);
      list.push({
        key:`overdue:${ct.id}`, type:'overdue', icon:'⏰',
        title:`Просрочен возврат: ${car?esc(car.make+' '+car.model):'машина'}`,
        subtitle:`${cl?esc(cl.name):'Клиент удалён'} · ${tl.text}`,
        onclick:`openContractDetail('${ct.id}')`
      });
    }
  });
  DB.cars.forEach(car=>{
    const { dueSoon, reminderDue, remaining } = oilStatus(car);
    if(dueSoon){
      list.push({
        key:`oil:${car.id}`, type:'oil', icon:'🛢',
        title:`Пора менять масло: ${esc(car.make+' '+car.model)}`,
        subtitle: remaining!=null ? `Просрочено на ${Math.abs(remaining).toLocaleString('ru-RU')} км` : 'Проверьте пробег',
        onclick:`openOilChangeForm('${car.id}')`
      });
    } else if(reminderDue){
      list.push({
        key:`oil-reminder:${car.id}`, type:'oil-reminder', icon:'🔔',
        title:`Проверить пробег: ${esc(car.make+' '+car.model)}`,
        subtitle:'Напоминание по времени о замене масла',
        onclick:`openRecordMileage('${car.id}')`
      });
    }
  });
  DB.clients.forEach(cl=>{
    const { debt } = clientDebt(cl.id);
    if(debt>0){
      list.push({
        key:`debt:${cl.id}`, type:'debt', icon:'⚠️',
        title:`Долг клиента: ${esc(cl.name)}`,
        subtitle:`${money(debt)}`,
        onclick:`openClientDetail('${cl.id}')`
      });
    }
  });
  return list;
}
function isNotifRead(key){
  return (DB.settings.readNotifKeys||[]).includes(key);
}
function updateNotifBadge(){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const count = computeNotifications().filter(n=>!isNotifRead(n.key)).length;
  if(count>0){ badge.textContent = count>99?'99+':count; badge.style.display = 'flex'; }
  else { badge.style.display = 'none'; }
}
function openNotifications(){
  const list = computeNotifications();
  const order = { overdue:0, oil:1, 'oil-reminder':2, debt:3 };
  list.sort((a,b)=>(order[a.type]??9)-(order[b.type]??9));
  const unreadCount = list.filter(n=>!isNotifRead(n.key)).length;
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Уведомления</div>
      <div class="sheet-head-actions">
        ${unreadCount>0 ? iconBtn('check','markAllNotificationsRead()',`Прочитать всё (${unreadCount})`) : ''}

        const read = isNotifRead(n.key);
        return `<div class="report-row" style="cursor:pointer;align-items:flex-start;${read?'opacity:.55;':''}" onclick="closeSheet();${n.onclick}">
          <span class="rl" style="display:flex;gap:8px;align-items:flex-start;">

        </div>`;
      }).join('')}</div>` : `<div style="text-align:center;color:var(--text-dim);font-size:13.5px;padding:40px 10px;">Уведомлений нет — всё под контролем 👍</div>`}
    </div>

async function markAllNotificationsRead(){
  const keys = computeNotifications().map(n=>n.key);
  const cur = new Set(DB.settings.readNotifKeys||[]);
  keys.forEach(k=>cur.add(k));
  DB.settings.readNotifKeys = [...cur];
  await persist('settings');
  updateNotifBadge();
  openNotifications();
  showToast('Все уведомления отмечены как прочитанные');
}

/* =================== REVENUE ENGINE =================== */
// Prorates each contract's total across the days it covers, then buckets by day.
function dailyRevenueMap(){
  const map = {}; // 'YYYY-MM-DD' -> amount
  DB.contracts.forEach(ct=>{
    if(ct.status==='cancelled') return;
    if(ct.type && ct.type!=='rental') return;
    const days = rentalDays(ct.start, ct.end);
    const perDay = (ct.total || 0) / days;
    let d = new Date(ct.start);
    d.setHours(0,0,0,0);
    for(let i=0;i<days;i++){
      const key = toISO(d);
      map[key] = (map[key]||0) + perDay;
      d.setDate(d.getDate()+1);
    }
  });
  return map;
}
function dailyExpenseMap(){
  const map = {}; // 'YYYY-MM-DD' -> amount, repair costs only
  DB.contracts.forEach(ct=>{
    if(ct.type!=='repair') return;
    const key = dateOnly(ct.start);
    map[key] = (map[key]||0) + (ct.total||0);
  });
  return map;
}
function sumRange(map, startISO, endISO){
  let sum = 0;
  for(const k in map){ if(k>=startISO && k<=endISO) sum += map[k]; }
  return sum;
}
function periodRange(period){
  const now = new Date();
  if(period==='week'){
    const day = (now.getDay()+6)%7; // Monday start
    const start = new Date(now); start.setDate(now.getDate()-day);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return [toISO(start), toISO(end)];
  }
  if(period==='month'){
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return [toISO(start), toISO(end)];
  }
  if(period==='year'){
    const start = new Date(now.getFullYear(),0,1);
    const end = new Date(now.getFullYear(),11,31);
    return [toISO(start), toISO(end)];
  }
  // all time
  const dates = DB.contracts.map(c=>dateOnly(c.start)).sort();
  const start = dates.length ? dates[0] : toISO(now);
  return [start, toISO(now)];
}

/* =================== DASHBOARD =================== */
function renderDashboard(){
  const map = dailyRevenueMap();
  const [s,e] = periodRange(gaugePeriod);
  const revenue = sumRange(map, s, e);
  const maxRef = { week: 30000, month: 120000, year: 1200000 }[gaugePeriod] || 100000;
  // dynamic scale: use the greater of a sane baseline or 1.3x current revenue
  const scaleMax = Math.max(maxRef, revenue*1.15, 1000);
  const pct = Math.min(1, revenue/scaleMax);
  const angle = pct * 180; // degrees across the semicircle

  const gaugeSvg = buildGauge(angle);

  const periodLabel = {week:'за неделю', month:'за месяц', year:'за год'}[gaugePeriod];

  const hasData = DB.cars.length || DB.clients.length || DB.contracts.length;
  const lastBk = DB.settings.lastBackupAt;
  const daysSinceBk = lastBk ? Math.floor((Date.now()-new Date(lastBk))/86400000) : Infinity;
  const needsBackup = hasData && daysSinceBk >= 7;

  const upcoming = DB.contracts
    .filter(c=>c.status==='active')
    .sort((a,b)=> new Date(a.end) - new Date(b.end))
    .slice(0,3);

  return `
    <div class="dash-top">
      <div class="revenue-card">
        <div class="revenue-eyebrow">Выручка ${periodLabel}</div>
        <div class="revenue-value">${money(revenue)}</div>
        <div class="gauge-wrap">${gaugeSvg}</div>
        <div class="gauge-period-row">
          <button class="${gaugePeriod==='week'?'active':''}" onclick="gaugePeriod='week';render()">Неделя</button>
          <button class="${gaugePeriod==='month'?'active':''}" onclick="gaugePeriod='month';render()">Месяц</button>
          <button class="${gaugePeriod==='year'?'active':''}" onclick="gaugePeriod='year';render()">Год</button>
        </div>
      </div>
    </div>

    ${renderDashboardCards()}

    <div class="section-title">Скоро возврат</div>
    ${upcoming.length ? upcoming.map(c=>contractCard(c)).join('') : `<div class="empty"><div class="t">Нет активных аренд</div><div class="d">Добавьте новый договор через кнопку «+»</div></div>`}

    ${needsBackup ? `
    <div class="card" style="border-color:rgba(242,169,59,0.4);cursor:pointer;" onclick="openSettings()">
      <div class="card-avatar" style="color:var(--accent);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Пора сделать резервную копию</div>
        <div class="card-sub">${lastBk ? `Последняя копия — ${daysSinceBk} дн. назад` : 'Резервная копия ещё ни разу не создавалась'}</div>
      </div>
    </div>` : ''}
  `;
}
const DASHBOARD_CARD_IDS_ALL = ['income','clientDebt','finesUnpaid','finesPaid','repairExpense'];
const DASHBOARD_CARD_IDS_DEFAULT = ['income','clientDebt','finesUnpaid','finesPaid','repairExpense'];
function dashboardCardDefs(){
  const totalIncome = DB.contracts.filter(c=>(!c.type||c.type==='rental') && c.status!=='cancelled').reduce((s,c)=>s+(c.total||0),0);
  const totalClientDebt = DB.clients.reduce((s,cl)=>{ const {debt}=clientDebt(cl.id); return s+Math.max(0,debt); },0);
  const fineContracts = DB.contracts.filter(c=>c.type==='fine');
  const finesUnpaid = fineContracts.reduce((s,c)=>s+Math.max(0,(c.total||0)-finePaidAmount(c.id)),0);
  const finesPaid = fineContracts.reduce((s,c)=>s+Math.min(c.total||0, finePaidAmount(c.id)),0);
  const repairExpense = DB.contracts.filter(c=>c.type==='repair').reduce((s,c)=>s+(c.total||0),0);
  return {
    income: { icon:'💰', label:'Общий доход', value: money(totalIncome), cls:'c-income' },
    clientDebt: { icon:'⚠️', label:'Долг клиентов', value: money(totalClientDebt), cls: totalClientDebt>0?'c-warn':'' },
    finesUnpaid: { icon:'🔴', label:'Штрафы неоплаченные', value: money(finesUnpaid), cls: finesUnpaid>0?'c-warn':'' },
    finesPaid: { icon:'✅', label:'Штрафы оплаченные', value: money(finesPaid), cls:'c-income' },
    repairExpense: { icon:'🔧', label:'Расход на ремонт', value: money(repairExpense), cls:'c-warn' },
  };
}
function dashboardCardOrder(){
  const defs = dashboardCardDefs();
  let order = (DB.settings.dashboardCardOrder && DB.settings.dashboardCardOrder.length) ? DB.settings.dashboardCardOrder.slice() : DASHBOARD_CARD_IDS_DEFAULT.slice();

}

async function moveDashboardCard(id, dir){
  const order = dashboardCardOrder();
  const idx = order.indexOf(id);
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=order.length) return;
  [order[idx],order[newIdx]] = [order[newIdx],order[idx]];
  DB.settings.dashboardCardOrder = order;

  openDashboardCustomize();
}

function buildGauge(angleDeg){
  // semicircle gauge, 220x130 viewport, center (110,120), radius 95
  const cx=110, cy=120, r=95;
  const startA = 180, endA = 0; // sweep from 180deg (left) to 0deg (right) along top
  const needleA = 180 - angleDeg;
  const rad = a => a * Math.PI/180;
  const arcPoint = (a,rr) => [cx + rr*Math.cos(rad(a)), cy - rr*Math.sin(rad(a))];
  const [nx,ny] = arcPoint(needleA, r-14);
  // track arc path
  const [sx,sy] = arcPoint(180, r);
  const [ex,ey] = arcPoint(0, r);
  const trackPath = `M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey}`;
  const arcLen = Math.PI*r;
  const fillLen = arcLen * (angleDeg/180);
  const ticks = [0,45,90,135,180].map(a=>{
    const [x1,y1]=arcPoint(a,r+3); const [x2,y2]=arcPoint(a,r-8);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#333a4a" stroke-width="2" stroke-linecap="round"/>`;
  }).join('');
  return `
  <svg viewBox="0 0 220 130">
    <path d="${trackPath}" fill="none" stroke="#2c3242" stroke-width="12" stroke-linecap="round"/>
    <path d="${trackPath}" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${fillLen} ${arcLen}"/>
    ${ticks}
    <defs>
      <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3ec9a7"/>
        <stop offset="55%" stop-color="#f2a93b"/>
        <stop offset="100%" stop-color="#f2a93b"/>
      </linearGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#eef0f4"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#eef0f4" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function clientDebt(clientId){
  const rentals = DB.contracts.filter(ct=>ct.clientId===clientId && ct.status!=='cancelled');
  const unpaidSum = rentals.reduce((s,ct)=> s + (!ct.paid ? ct.total : 0), 0);
  const ledger = DB.clientLedger.filter(l=>l.clientId===clientId);
  const finesSum = ledger.filter(l=>l.type==='fine').reduce((s,l)=>s+(l.amount||0),0);
  const paymentsSum = ledger.filter(l=>l.type==='payment').reduce((s,l)=>s+(l.amount||0),0);
  return { unpaidSum, finesSum, paymentsSum, debt: unpaidSum + finesSum - paymentsSum, ledger };
}

function dayWord(n){
  const n10 = n%10, n100 = n%100;
  if(n100>=11 && n100<=14) return 'дней';
  if(n10===1) return 'день';
  if(n10>=2 && n10<=4) return 'дня';
  return 'дней';
}

function renderContracts(){
  const statusOrder = { active:0, service:0, booked:1, done:2, cancelled:2 };
  let list = DB.contracts.filter(ct=>{
    const q = searchQ.contracts.toLowerCase();
    if(!q) return true;
    const car = DB.cars.find(c=>c.id===ct.carId);
    const cl = DB.clients.find(c=>c.id===ct.clientId);
    return ((car?car.make+' '+car.model:'')+' '+(cl?cl.name:'')).toLowerCase().includes(q);
  }).sort((a,b)=>{
    const oa = statusOrder[a.status]??3, ob = statusOrder[b.status]??3;
    if(oa!==ob) return oa-ob;
    // within active/booked: soonest deadline/start first; within done/cancelled: most recently finished first
    // (contract.end is set to the actual completion moment when a rental is finished, so a long-running
    // rental that just ended today still surfaces near the top instead of sinking by its old start date)
    if(a.status==='active') return new Date(a.end) - new Date(b.end);
    if(a.status==='booked') return new Date(a.start) - new Date(b.start);
    return new Date(b.end) - new Date(a.end);
  });
  return `
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Поиск по клиенту, машине" value="${escapeAttr(searchQ.contracts)}" oninput="searchQ.contracts=this.value;render()">
    </div>
    <div class="section-title">Договоры <span class="count">${list.length}</span></div>
    ${list.length ? list.map(contractCard).join('') : emptyState('Пока нет договоров','Нажмите «+», чтобы оформить первую аренду')}
  `;
}

      </div>

      ${ct.status==='active' ? `<div class="card-actions"><button class="mini-btn finish" onclick="event.stopPropagation();openCompleteContract('${ct.id}')">Завершить аренду</button></div>` : ''}

function recalcContractTotal(){
  const startEl = document.getElementById('f_start'), endEl = document.getElementById('f_end');
  if(!startEl.value || !endEl.value) return;
  const rate = parseFloat(document.getElementById('f_crate').value)||0;
  const type = document.getElementById('f_rentalType')?.value || 'daily';
  if(type==='6h'){
    document.getElementById('f_total').value = rate;
  } else {
    const days = rentalDays(startEl.value, endEl.value);
    document.getElementById('f_total').value = rate*days;
  }
}
async function saveContract(id){
  const status = document.getElementById('f_cstatus').value;
  const carId = document.getElementById('f_car').value;
  let data;
  if(status==='service'){
    const repairDate = document.getElementById('f_repairdate').value;
    if(!repairDate){ showToast('Укажите дату ремонта'); return; }
    const amount = parseFloat(document.getElementById('f_repairamount').value)||0;
    const desc = document.getElementById('f_repairdesc').value.trim();
    data = {
      carId,
      clientId: null,
      start: repairDate+'T00:00', end: repairDate+'T00:00',
      rentalType: null,
      rate: 0,
      total: amount,
      status: 'service',
      paid: true,
      notes: desc,
      type: 'repair',
    };
  } else {
    const start = document.getElementById('f_start').value;
    const end = document.getElementById('f_end').value;
    const clientId = document.getElementById('f_client').value;
    if(!clientId){ showToast('Выберите или добавьте клиента'); return; }
    if(!start || !end){ showToast('Укажите дату и время начала и конца'); return; }
    if(new Date(end) <= new Date(start)){ showToast('Окончание должно быть позже начала'); return; }
    data = {
      carId,
      clientId,
      start, end,
      rentalType: document.getElementById('f_rentalType').value,
      rate: parseFloat(document.getElementById('f_crate').value)||0,
      total: parseFloat(document.getElementById('f_total').value)||0,
      status,
      paid: document.getElementById('f_paid').value==='1',
      notes: document.getElementById('f_ctnotes').value.trim(),
      type: 'rental',
    };
  }
  if(id){
    const idx = DB.contracts.findIndex(c=>c.id===id);
    const wasEnd = DB.contracts[idx].end;
    DB.contracts[idx] = {...DB.contracts[idx], ...data};
    if(wasEnd !== data.end) DB.contracts[idx].notifiedOneHour = false;
  } else {
    const newCt = { id: uid(), notifiedOneHour:false, ...data };
    DB.contracts.push(newCt);
    if(data.type!=='repair'){
      const cl = DB.clients.find(c=>c.id===data.clientId);
      if(cl && cl.phone){
        sendWhatsApp(cl.phone, buildContractMessage(newCt)).then(r=>{
          if(r.ok) showToast('Договор отправлен клиенту в WhatsApp');
          else if(r.reason!=='not_configured') showToast('Не удалось отправить WhatsApp');
        });
      }
    }
  }
  // sync car status
  const car = DB.cars.find(c=>c.id===data.carId);
  if(car){
    if(data.status==='active') car.status = 'rented';
    else if(data.status==='booked') car.status = 'booked';
    else if(data.status==='service') car.status = 'service';
    else if(car.status==='rented' || car.status==='booked' || car.status==='service') car.status = 'free';
  }
  await persist('contracts'); await persist('cars');
  closeSheet(); render(); showToast(data.type==='repair' ? 'Ремонт сохранён' : 'Договор сохранён');
}

  if(!ct.clientId){ showToast('У этого штрафа нет привязанного клиента'); return; }
  const paidSoFar = finePaidAmount(contractId);
  const remaining = Math.max(0, ct.total - paidSoFar);
  let amount = parseFloat(document.getElementById('f_settle_amount').value);
  if(isNaN(amount) || amount<=0){ showToast('Укажите сумму погашения'); return; }
  if(amount>remaining) amount = remaining;
  DB.clientLedger.push({ id: uid(), clientId: ct.clientId, type:'payment', amount, date: nowDT(), note: 'Погашение штрафа', fineId: contractId });
  await persist('clientLedger');
  showToast(amount>=remaining ? 'Штраф погашен полностью' : `Внесено ${money(amount)}, остаток уменьшен`);
  openFineContractDetail(ct);
}

  ct.total = sum;
  ct.status = 'done';
  ct.paid = markPaid ? true : ct.paid;
  ct.end = nowDT();
  const car = DB.cars.find(c=>c.id===ct.carId);
  if(car) car.status = 'free';
  await persist('contracts'); await persist('cars');
  render();
  showToast(markPaid ? `Оплата ${money(sum)} добавлена, машина свободна` : 'Аренда завершена, машина свободна');

}

function renderOilReport(){
  return `
    <div class="section-title" style="margin-top:14px;">Машины <span class="count">${DB.cars.length}</span></div>
    <div class="card" style="display:block;">
      ${DB.cars.length ? DB.cars.map(car=>{

        return `<div class="report-row" style="flex-direction:column;align-items:stretch;gap:8px;">

              Текущий пробег: ${mileage!=null ? mileage.toLocaleString('ru-RU')+' км' : 'не указан'}<br>
              Последняя замена: ${lastMil!=null ? lastMil.toLocaleString('ru-RU')+' км'+(lastDate?' · '+fmtDate(lastDate):'') : 'не указана'}
              ${remaining!=null ? (remaining>=0 ? `<br>До следующей замены: ${remaining.toLocaleString('ru-RU')} км` : `<br>Просрочено на ${Math.abs(remaining).toLocaleString('ru-RU')} км`) : ''}

              ${reminderDue ? `<span class="badge booked">🔔 Проверить пробег</span>` : ''}
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn ghost" style="flex:1;padding:9px 10px;font-size:12.5px;" onclick="event.stopPropagation();openRecordMileage('${car.id}')">Записать пробег</button>
            <button class="btn ghost" style="flex:1;padding:9px 10px;font-size:12.5px;" onclick="event.stopPropagation();openOilChangeForm('${car.id}')">Замена масла</button>
          </div>
        </div>`;
      }).join('') : `<div style="color:var(--text-dim);font-size:13px;padding:6px 2px;">Машин пока нет</div>`}
    </div>
  `;
}
function oilStatus(car){
  const mileage = car.currentMileage;
  const nextMil = car.nextOilMileage;
  const lastMil = car.lastOilChangeMileage;
  const lastDate = car.lastOilChangeDate;
  const sinceChange = (mileage!=null && lastMil!=null) ? (mileage - lastMil) : null;
  const remaining = (mileage!=null && nextMil!=null) ? (nextMil - mileage) : null;
  const dueSoon = remaining!=null && remaining<=0;
  const reminderDue = car.oilReminderDate ? (todayISO() >= car.oilReminderDate) : false;
  return { mileage, nextMil, lastMil, lastDate, sinceChange, remaining, dueSoon, reminderDue };
}
function oilHistoryHtml(carId){
  const log = DB.oilChanges.filter(l=>l.carId===carId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!log.length) return `<div style="color:var(--text-dim);font-size:13px;padding:6px 2px;">Записей пока нет</div>`;
  return log.map(l=>{
    if(l.type==='change'){
      return `<div class="report-row">
        <span class="rl">🛢 Замена масла: ${l.mileage.toLocaleString('ru-RU')} км${l.nextMileage?' → следующая на '+l.nextMileage.toLocaleString('ru-RU')+' км':''}${l.note?' · '+esc(l.note):''} · ${fmtDate(l.date)}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="rv" style="color:var(--danger);">${money(l.amount||0)}</span>
          <span onclick="deleteOilLogEntry('${l.id}')" style="cursor:pointer;color:var(--text-faint);font-size:16px;line-height:1;">×</span>
        </span>
      </div>`;
    }
    return `<div class="report-row">
      <span class="rl">📏 Пробег: ${l.mileage.toLocaleString('ru-RU')} км${l.nextMileage?' · напоминание на '+l.nextMileage.toLocaleString('ru-RU')+' км':''} · ${fmtDate(l.date)}</span>
      <span onclick="deleteOilLogEntry('${l.id}')" style="cursor:pointer;color:var(--text-faint);font-size:16px;line-height:1;">×</span>
    </div>`;
  }).join('');
}
async function deleteOilLogEntry(id){
  if(!confirm('Удалить запись?')) return;
  const entry = DB.oilChanges.find(l=>l.id===id);
  const carId = entry?.carId;
  DB.oilChanges = DB.oilChanges.filter(l=>l.id!==id);
  DB.contracts = DB.contracts.filter(c=>!(c.id===id && c.type==='oil'));
  await persist('oilChanges'); await persist('contracts');
  if(carId && document.getElementById('f_mileage')) openRecordMileage(carId);
  else if(carId && document.getElementById('f_oil_cur')) openOilChangeForm(carId);
  else render();
}
function rentalWord(n){
  const n10 = n%10, n100 = n%100;
  if(n100>=11 && n100<=14) return 'аренд';
  if(n10===1) return 'аренда';
  if(n10>=2 && n10<=4) return 'аренды';
  return 'аренд';
}
function openRecordMileage(carId){
  const car = DB.cars.find(c=>c.id===carId); if(!car) return;
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Пробег · ${esc(car.make+' '+car.model)}</div>

    </div>

async function saveMileageRecord(carId){
  const car = DB.cars.find(c=>c.id===carId); if(!car) return;
  const mileage = parseFloat(document.getElementById('f_mileage').value);
  if(isNaN(mileage) || mileage<0){ showToast('Укажите текущий пробег'); return; }
  const targetRaw = document.getElementById('f_mileage_target').value;
  const target = targetRaw!=='' ? parseFloat(targetRaw) : null;
  const date = document.getElementById('f_mileage_date').value || todayISO();
  const reminderRaw = document.getElementById('f_mileage_reminder').value;
  const reminderDays = reminderRaw!=='' ? parseInt(reminderRaw) : null;
  car.currentMileage = mileage;
  car.currentMileageDate = date;
  if(target!=null) car.nextOilMileage = target;
  if(reminderDays!=null){
    car.oilReminderDays = reminderDays;
    const rd = new Date(date); rd.setDate(rd.getDate()+reminderDays);
    car.oilReminderDate = toISO(rd);
  }
  DB.oilChanges.push({ id: uid(), carId, type:'mileage', mileage, nextMileage: target, date });
  await persist('cars'); await persist('oilChanges');
  showToast('Пробег записан');
  openRecordMileage(carId);
}

function updateNextMileagePreview(){
  const curEl = document.getElementById('f_oil_cur');
  const intEl = document.getElementById('f_oil_interval');
  const prevEl = document.getElementById('nextMileagePreview');
  if(!curEl || !intEl || !prevEl) return;
  const cur = parseFloat(curEl.value)||0;
  const interval = parseFloat(intEl.value)||0;
  prevEl.textContent = (cur+interval).toLocaleString('ru-RU') + ' км';
}
async function saveOilChange(carId){
  const car = DB.cars.find(c=>c.id===carId); if(!car) return;
  const mileage = parseFloat(document.getElementById('f_oil_cur').value);
  if(isNaN(mileage) || mileage<0){ showToast('Укажите пробег на момент замены'); return; }
  const interval = parseFloat(document.getElementById('f_oil_interval').value)||8000;
  const nextMileage = mileage + interval;
  const date = document.getElementById('f_oil_date').value || todayISO();
  const amount = parseFloat(document.getElementById('f_oil_amount').value)||0;
  const note = document.getElementById('f_oil_note').value.trim();
  const id = uid();
  DB.oilChanges.push({ id, carId, type:'change', mileage, nextMileage, amount, note, date });
  DB.contracts.push({ id, carId, clientId:null, start:date, end:date, rentalType:null, rate:0, total:amount, status:'done', paid:true, notes:note, type:'oil', notifiedOneHour:false });
  car.currentMileage = mileage;
  car.currentMileageDate = date;
  car.lastOilChangeMileage = mileage;
  car.lastOilChangeDate = date;
  car.nextOilMileage = nextMileage;
  car.oilIntervalKm = interval;
  await persist('oilChanges'); await persist('cars'); await persist('contracts');
  showToast('Замена масла записана');
  openOilChangeForm(carId);
}

async function saveQuickRepair(carId, existingId){
  const amount = parseFloat(document.getElementById('qr_amount').value)||0;
  if(amount<=0){ showToast('Укажите сумму ремонта'); return; }
  const date = document.getElementById('qr_date').value || todayISO();
  const desc = document.getElementById('qr_desc').value.trim();
  const clientId = document.getElementById('qr_client').value || null;
  if(existingId){
    const idx = DB.contracts.findIndex(c=>c.id===existingId);
    if(idx>-1){
      DB.contracts[idx] = { ...DB.contracts[idx], total:amount, start:date+'T00:00', end:date+'T00:00', notes:desc, clientId };
    }
  } else {
    DB.contracts.push({
      id: uid(), carId, clientId, start:date+'T00:00', end:date+'T00:00',
      rentalType:null, rate:0, total:amount, status:'done', paid:true, notes:desc, type:'repair', notifiedOneHour:false
    });
  }
  await persist('contracts');
  showToast(existingId ? 'Ремонт обновлён' : 'Ремонт добавлен в историю');
  openCarRepairHistory(carId);
}
async function deleteQuickRepair(id, carId){

  DB.contracts = DB.contracts.filter(c=>c.id!==id);
  await persist('contracts');
  showToast('Запись удалена');
  openCarRepairHistory(carId);

function openCarReportDetail(carId){
  const car = DB.cars.find(c=>c.id===carId);
  const all = DB.contracts.filter(ct=>ct.carId===carId && ct.status!=='cancelled').sort((a,b)=>new Date(b.start)-new Date(a.start));
  const revenue = all.filter(ct=>!ct.type || ct.type==='rental').reduce((s,ct)=>s+(ct.total||0),0);
  const expense = all.filter(ct=>ct.type==='repair' || ct.type==='oil').reduce((s,ct)=>s+(ct.total||0),0);
  const oilTotal = DB.oilChanges.filter(o=>o.carId===carId).reduce((s,o)=>s+(o.amount||0),0);
  const { mileage, lastMil, lastDate, sinceChange, remaining, dueSoon } = car ? oilStatus(car) : {};
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">${car?esc(car.make+' '+car.model):'Машина удалена'}</div>
      <div class="sheet-head-actions">${iconBtn('close','closeSheet()','Закрыть')}</div>
    </div>
    <div class="sheet-body">
      <div class="stat-row">
        <div class="stat-mini good"><div class="n">${money(revenue)}</div><div class="l">Доход</div></div>
        <div class="stat-mini warn"><div class="n">${money(expense)}</div><div class="l">Расход на ремонт</div></div>
      </div>
      <div class="stat-row" style="margin-top:10px;">
        <div class="stat-mini ${revenue-expense>=0?'good':'warn'}"><div class="n">${money(revenue-expense)}</div><div class="l">Итог</div></div>
        <div class="stat-mini"><div class="n">${all.length}</div><div class="l">Договоров всего</div></div>
      </div>

      ${car ? `
      <div class="section-title">Замена масла</div>
      <div class="detail-block">
        <div class="detail-row"><span class="k">Текущий пробег</span><span class="v">${mileage!=null?mileage.toLocaleString('ru-RU')+' км':'не указан'}</span></div>
        <div class="detail-row"><span class="k">Последняя замена</span><span class="v">${lastMil!=null?lastMil.toLocaleString('ru-RU')+' км'+(lastDate?' · '+fmtDate(lastDate):''):'не указана'}</span></div>
        ${sinceChange!=null ? `<div class="detail-row"><span class="k">Пройдено с замены</span><span class="v">${sinceChange.toLocaleString('ru-RU')} км</span></div>` : ''}
        ${remaining!=null ? `<div class="detail-row"><span class="k">${remaining>=0?'До следующей замены':'Просрочено на'}</span><span class="v" style="${dueSoon?'color:var(--danger);font-weight:800;':''}">${Math.abs(remaining).toLocaleString('ru-RU')} км</span></div>` : ''}
        <div class="detail-row"><span class="k">Расход на масло всего</span><span class="v" style="color:var(--danger);">${money(oilTotal)}</span></div>
      </div>
      <div class="btn-row">
        <button class="btn ghost" onclick="openRecordMileage('${car.id}')">Записать пробег</button>
        <button class="btn ghost" onclick="openOilChangeForm('${car.id}')">Замена масла</button>
      </div>
      ` : ''}

      <div class="section-title" style="margin-top:16px;">Все договоры машины <span class="count">${all.length}</span></div>
      ${all.length ? all.map(ct=>contractCard(ct)).join('') : `<div style="color:var(--text-dim);font-size:13px;padding:6px 2px;">Договоров ещё не было</div>`}
    </div>
  `);
}
function barsHtml(vals){
  const max = Math.max(1, ...vals.map(v=>v.v));
  return `<div class="bars">${vals.map(v=>`
    <div class="bar-col">
      <div class="bar-fill" style="height:${Math.max(3,(v.v/max)*100)}%;"></div>
      <div class="bar-label">${v.label}</div>
    </div>`).join('')}</div>`;
}

function applyColorMode(mode){
  document.body.classList.toggle('theme-light', mode==='light');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', mode==='light' ? '#f6f7f9' : '#14161c');
}

  DB.settings.colorMode = mode;

  applyColorMode(mode);
  openThemeSettings();
}

function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('Импорт заменит текущие данные приложения резервной копией. Продолжить?')) return;
      DB.cars = data.cars || [];
      DB.clients = data.clients || [];
      DB.contracts = data.contracts || [];
      DB.clientLedger = data.clientLedger || [];
      DB.oilChanges = data.oilChanges || [];
      DB.settings = data.settings || DB.settings;
      await persist('cars'); await persist('clients'); await persist('contracts'); await persist('clientLedger'); await persist('oilChanges'); await persist('settings');
      closeSheet(); render(); showToast('Данные восстановлены');
    }catch(e){ showToast('Файл повреждён или неверный формат'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
async function wipeAll(){

/* =================== CONTRACT AS IMAGE =================== */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawContractCanvas(ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  const W=860, H=1180;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1c2029'); bgGrad.addColorStop(1,'#14161c');
  ctx.fillStyle = bgGrad; roundRectPath(ctx,0,0,W,H,28); ctx.fill();
  ctx.strokeStyle = '#333a4a'; ctx.lineWidth = 2; roundRectPath(ctx,16,16,W-32,H-32,22); ctx.stroke();

  // brand mark
  const mGrad = ctx.createLinearGradient(48,48,112,112);
  mGrad.addColorStop(0,'#ffcf7a'); mGrad.addColorStop(1,'#f2a93b');
  ctx.fillStyle = mGrad; roundRectPath(ctx,48,48,62,62,16); ctx.fill();
  ctx.fillStyle = '#241a06'; ctx.font = '700 30px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('X', 79, 82);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = '#eef0f4'; ctx.font = '700 32px Arial, sans-serif';
  ctx.fillText('XCAR', 126, 78);
  ctx.fillStyle = '#9aa0ad'; ctx.font = '600 13px Arial, sans-serif';
  ctx.fillText('ДОГОВОР АРЕНДЫ АВТОМОБИЛЯ', 126, 100);

  ctx.strokeStyle='#333a4a'; ctx.beginPath(); ctx.moveTo(48,152); ctx.lineTo(W-48,152); ctx.stroke();

  let y = 200;
  function row(label, value, color){
    ctx.fillStyle = '#9aa0ad'; ctx.font = '400 15px Arial, sans-serif'; ctx.fillText(label, 48, y);
    ctx.fillStyle = color || '#eef0f4'; ctx.font = '700 23px Arial, sans-serif'; ctx.fillText(value, 48, y+32);
    y += 78;
  }
  row('Клиент', cl ? cl.name : '—');
  row('Телефон', cl && cl.phone ? cl.phone : '—');
  row('Автомобиль', car ? `${car.make} ${car.model}${car.plate ? ' · '+car.plate : ''}` : '—');
  row('Начало аренды', fmtDateTime(ct.start));
  row('Окончание аренды', fmtDateTime(ct.end));
  row('Статус', ct.status==='active'?'Активен':ct.status==='booked'?'Забронирован':ct.status==='done'?'Завершён':'Отменён');
  row('Оплата', ct.paid ? 'Оплачено' : 'Не оплачено', ct.paid ? '#3ec9a7' : '#e8604c');

  ctx.fillStyle = '#242936'; roundRectPath(ctx,48,y,W-96,120,16); ctx.fill();
  ctx.fillStyle = '#9aa0ad'; ctx.font = '600 14px Arial, sans-serif'; ctx.fillText('ИТОГО К ОПЛАТЕ', 74, y+42);
  ctx.fillStyle = '#f2a93b'; ctx.font = '700 42px Arial, sans-serif'; ctx.fillText(money(ct.total), 74, y+88);

  ctx.fillStyle = '#5d6472'; ctx.font = '400 12.5px Arial, sans-serif';
  ctx.fillText('Сформировано в приложении XCAR · ' + new Date().toLocaleDateString('ru-RU'), 48, H-46);

  return canvas;
}
function canvasToBlob(canvas){ return new Promise(res => canvas.toBlob(res, 'image/png')); }

function drawCarsStatusCanvas(){
  const order = { free:0, rented:1, booked:2, service:3 };
  const cars = DB.cars.slice().sort((a,b)=> (order[a.status]??9)-(order[b.status]??9) || a.make.localeCompare(b.make));
  const STATUS_COLOR = { free:'#22c55e', rented:'#3b82f6', booked:'#f2a93b', service:'#e8604c' };
  const STATUS_TEXT = { free:'Свободна', rented:'В аренде', booked:'Забронирована', service:'На ремонте' };
  const shortDT = s => { const d=new Date(s); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); };

  // Compact right-side text per car: status label + date/time, all on one line
  const carInfos = cars.map(car=>{
    let rightText = STATUS_TEXT[car.status] || car.status;
    if(car.status==='rented'){
      const ct = activeContractForCar(car.id);
      if(ct) rightText = `Аренда: ${shortDT(ct.start)} → ${shortDT(ct.end)}`;
    } else if(car.status==='booked'){
      const ct = DB.contracts.find(c=>c.carId===car.id && c.status==='booked');
      if(ct) rightText = `Бронь: ${shortDT(ct.start)} → ${shortDT(ct.end)}`;
    } else if(car.status==='service'){
      const ct = DB.contracts.find(c=>c.carId===car.id && c.status==='service' && c.type==='repair');
      if(ct) rightText = `Ремонт: с ${shortDT(ct.start)}`;
    }
    return { car, rightText };
  });

  const rowH = 56;
  const W = 1000, H = 260 + cars.length*rowH + 60;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff'; roundRectPath(ctx,0,0,W,H,28); ctx.fill();
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2; roundRectPath(ctx,16,16,W-32,H-32,22); ctx.stroke();

  const mGrad = ctx.createLinearGradient(48,48,112,112);
  mGrad.addColorStop(0,'#ffcf7a'); mGrad.addColorStop(1,'#f2a93b');
  ctx.fillStyle = mGrad; roundRectPath(ctx,48,48,62,62,16); ctx.fill();
  ctx.fillStyle = '#241a06'; ctx.font = '700 30px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('X', 79, 82);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = '#111827'; ctx.font = '700 32px Arial, sans-serif';
  ctx.fillText('XCAR', 126, 78);
  ctx.fillStyle = '#6b7280'; ctx.font = '600 13px Arial, sans-serif';
  ctx.fillText('СТАТУС АВТОПАРКА', 126, 100);

  ctx.strokeStyle='#e5e7eb'; ctx.beginPath(); ctx.moveTo(48,144); ctx.lineTo(W-48,144); ctx.stroke();

  let lx = 48;
  const ly = 180;
  [['free','Свободна'],['rented','В аренде'],['booked','Забронирована'],['service','На ремонте']].forEach(([k,label])=>{
    ctx.beginPath(); ctx.arc(lx+7, ly, 7, 0, Math.PI*2); ctx.fillStyle = STATUS_COLOR[k]; ctx.fill();
    ctx.fillStyle = '#374151'; ctx.font='600 14px Arial, sans-serif'; ctx.textAlign='left';
    ctx.fillText(label, lx+20, ly+5);
    lx += 20 + ctx.measureText(label).width + 30;
  });

  let y = 228;
  if(cars.length===0){
    ctx.fillStyle = '#9ca3af'; ctx.font = '500 16px Arial, sans-serif'; ctx.textAlign='center';
    ctx.fillText('Машин пока нет', W/2, y+20);
    ctx.textAlign='left';
  }
  carInfos.forEach(({car, rightText})=>{
    const boxH = rowH - 10;
    const midY = y + boxH/2;
    ctx.fillStyle = '#f8f9fb'; roundRectPath(ctx,48,y,W-96,boxH,12); ctx.fill();
    ctx.beginPath(); ctx.arc(48+27, midY, 8, 0, Math.PI*2); ctx.fillStyle = STATUS_COLOR[car.status]||'#9ca3af'; ctx.fill();
    ctx.fillStyle = '#111827'; ctx.font='700 16px Arial, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(`${car.make} ${car.model}${car.plate?' · '+car.plate:''}`, 48+52, midY);
    ctx.fillStyle = STATUS_COLOR[car.status]||'#9ca3af'; ctx.font='700 14px Arial, sans-serif'; ctx.textAlign='right';
    ctx.fillText(rightText, W-72, midY);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    y += rowH;
  });

  ctx.fillStyle = '#9ca3af'; ctx.font = '400 12.5px Arial, sans-serif';
  ctx.fillText('Сформировано в приложении XCAR · ' + new Date().toLocaleDateString('ru-RU'), 48, H-30);

  return canvas;
}

async function sendWhatsAppFile(phone, blob, filename, caption){
  const ga = DB.settings.greenApi;
  if(!ga || !ga.enabled || !ga.idInstance || !ga.apiTokenInstance) return {ok:false, reason:'not_configured'};
  const chatId = normalizePhone(phone);
  if(!chatId) return {ok:false, reason:'bad_phone'};
  try{
    const url = `https://api.greenapi.com/waInstance${ga.idInstance}/sendFileByUpload/${ga.apiTokenInstance}`;
    const fd = new FormData();
    fd.append('chatId', chatId);
    fd.append('file', blob, filename);
    if(caption) fd.append('caption', caption);
    const res = await fetch(url, { method:'POST', body: fd });
    return { ok: res.ok };
  }catch(e){ return { ok:false, reason:'network' }; }
}

  showToast(r.ok ? 'Договор отправлен клиенту картинкой' : 'Не удалось отправить — проверьте подключение WhatsApp');
}

/* =================== DEBT & CLIENT REPORT =================== */
function currentDueAmount(ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const now = new Date();
  const start = new Date(ct.start);
  const elapsedMs = Math.max(0, now-start);
  if(ct.rentalType==='6h'){
    const blocks = Math.floor(elapsedMs/(6*3600*1000));
    return blocks * (ct.rate || car?.rate6h || 0);
  }
  const days = Math.floor(elapsedMs/86400000);
  return days * (ct.rate || car?.rate || 0);
}
async function sendDebtToClient(carId){
  const ac = activeContractForCar(carId);
  if(!ac){ showToast('Нет активного договора по этой машине'); return; }
  const cl = DB.clients.find(c=>c.id===ac.clientId);
  if(!cl || !cl.phone){ showToast('У клиента не указан телефон'); return; }
  if(!DB.settings.greenApi?.enabled){ showToast('Сначала подключите WhatsApp в настройках'); return; }
  const car = DB.cars.find(c=>c.id===carId);
  const due = ac.paid ? 0 : currentDueAmount(ac);
  const msg = `Здравствуйте, ${cl.name}!\n\nНакопленная сумма к оплате за аренду ${car?car.make+' '+car.model:''} на текущий момент: ${money(due)}.\nАренда началась: ${fmtDateTime(ac.start)}.\n\nПросим произвести оплату. Спасибо, что выбираете XCAR!`;
  showToast('Отправка...');
  const r = await sendWhatsApp(cl.phone, msg);
  showToast(r.ok ? `Долг отправлен: ${cl.name}` : 'Не удалось отправить сообщение');
}

  const rows = rentals.slice(0,8);
  const W=860, H=560+rows.length*54;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1c2029'); bgGrad.addColorStop(1,'#14161c');
  ctx.fillStyle = bgGrad; roundRectPath(ctx,0,0,W,H,28); ctx.fill();
  ctx.strokeStyle = '#333a4a'; ctx.lineWidth = 2; roundRectPath(ctx,16,16,W-32,H-32,22); ctx.stroke();

/* =================== WHATSAPP / GREEN API =================== */
function normalizePhone(phone){
  const digits = (phone||'').replace(/\D/g,'');
  if(digits.length<10) return null;
  return digits+'@c.us';
}
async function saveGreenApi(testAfter){
  const idInstance = document.getElementById('f_ga_id').value.trim();
  const apiTokenInstance = document.getElementById('f_ga_token').value.trim();
  const enabled = document.getElementById('f_ga_enabled').checked;
  DB.settings.greenApi = { idInstance, apiTokenInstance, enabled };
  await persist('settings');
  const statusEl = document.getElementById('gaStatus');
  if(!testAfter){ showToast('Настройки WhatsApp сохранены'); statusEl.textContent='Ключи сохранены'; return; }
  if(!idInstance || !apiTokenInstance){ statusEl.textContent='Заполните оба поля'; statusEl.style.color='var(--danger)'; return; }
  statusEl.textContent='Проверка подключения...'; statusEl.style.color='var(--text-dim)';
  try{
    const url = `https://api.greenapi.com/waInstance${idInstance}/getStateInstance/${apiTokenInstance}`;
    const res = await fetch(url);
    const data = await res.json();
    if(res.ok && data.stateInstance==='authorized'){
      statusEl.textContent = '✓ Подключено, WhatsApp авторизован';
      statusEl.style.color = 'var(--accent-2)';
      showToast('Green API подключён');
    } else if(res.ok){
      statusEl.textContent = `Инстанс отвечает, но статус: ${data.stateInstance||'неизвестен'} (проверьте авторизацию в личном кабинете Green API)`;
      statusEl.style.color = 'var(--accent)';
    } else {
      statusEl.textContent = 'Не удалось подключиться — проверьте ID и токен';
      statusEl.style.color = 'var(--danger)';
    }
  }catch(e){
    statusEl.textContent = 'Ошибка сети при проверке подключения';
    statusEl.style.color = 'var(--danger)';
  }
}
async function sendWhatsApp(phone, message){
  const ga = DB.settings.greenApi;
  if(!ga || !ga.enabled || !ga.idInstance || !ga.apiTokenInstance) return {ok:false, reason:'not_configured'};
  const chatId = normalizePhone(phone);
  if(!chatId) return {ok:false, reason:'bad_phone'};
  try{
    const url = `https://api.greenapi.com/waInstance${ga.idInstance}/sendMessage/${ga.apiTokenInstance}`;
    const res = await fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chatId, message })
    });
    return { ok: res.ok };
  }catch(e){ return { ok:false, reason:'network' }; }
}
function buildContractMessage(ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  return `Здравствуйте${cl?', '+cl.name:''}!\n\nВаш договор аренды в XCAR оформлен:\n🚗 ${car?car.make+' '+car.model:''}${car?.plate?' · '+car.plate:''}\n📅 Начало: ${fmtDateTime(ct.start)}\n📅 Окончание: ${fmtDateTime(ct.end)}\n💰 Сумма: ${money(ct.total)}\n\nСпасибо, что выбираете XCAR!`;

function buildReminderMessage(ct){
  const car = DB.cars.find(c=>c.id===ct.carId);
  const cl = DB.clients.find(c=>c.id===ct.clientId);
  return `${cl?cl.name+', н':'Н'}апоминаем: через 1 час заканчивается аренда автомобиля ${car?car.make+' '+car.model:''}${car?.plate?' ('+car.plate+')':''}.\nПланируемое время возврата: ${fmtDateTime(ct.end)}.\nПросим вернуть машину вовремя. Спасибо!`;
